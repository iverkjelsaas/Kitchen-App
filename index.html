function renderStock(){
  const el=document.getElementById("stock-list");
  if(!state.items.length){
    el.innerHTML=`<div class="empty"><p>Your kitchen is empty. Load the pantry list to tick off what you already have, or add items one by one above.</p>
      <div class="btns"><button class="btn" id="load-starter">Load pantry list</button></div></div>`;
    document.getElementById("load-starter").onclick=()=>{
      state.items=ALL_CATALOG.map(([k,n,c,l])=>({id:uid(),key:k,name:n,cat:c,loc:l,status:"none"}));
      persist(); render(); toast("Tap Not kept to mark what you have");
    };
    return;
  }
  let dismissed=false; try{ dismissed=localStorage.getItem("kitchen-extra-dismissed")==="1"; }catch(_){}
  const extraN=missingExtra().length;
  const banner=(extraN&&!dismissed)?`<div class="banner"><p><strong>${extraN} ingredients</strong> used by the new recipes aren't on your list yet. Add them as Not kept, then tap the ones you have.</p>
    <div class="btns"><button class="btn" data-act="add-extra">Add them</button><button class="btn ghost" data-act="dismiss-extra">Not now</button></div></div>`:"";
  let items=state.items.filter(i=>(locFilter==="all"||i.loc===locFilter)&&!(hideNone&&i.status==="none")&&(!query||i.name.toLowerCase().includes(query)));
  if(!items.length){ el.innerHTML=banner+`<p class="hint">${query?"No match. Press Add to add it.":"Nothing to show here."}</p>`; return; }
  const groups={};
  items.forEach(i=>(groups[i.cat]=groups[i.cat]||[]).push(i));
  el.innerHTML=banner+CAT_ORDER.filter(c=>groups[c]).map(c=>{
    const g=groups[c].sort((a,b)=>a.name.localeCompare(b.name));
    const have=g.filter(inStock).length;
    return `<h2>${esc(c)}<small>${have} of ${g.length}</small></h2><ul>${g.map(i=>`
      <li class="row" data-id="${i.id}">
        <span class="name">${(()=>{ const n=USE_COUNT[i.key]||USE_COUNT[slug(i.name)]||0;
          const sub=[locFilter==="all"?LOC_LABEL[i.loc]:"", n?`${n} recipe${n===1?"":"s"}`:""].filter(Boolean).join(" · ");
          return (n?`<button class="nm" data-act="recipes" aria-label="Show recipes with ${esc(i.name)}">${esc(i.name)}</button>`:esc(i.name))+(sub?`<span class="loc">${sub}</span>`:""); })()}</span>
        <button class="status ${i.status}" data-act="cycle" aria-label="${esc(i.name)}: ${STATUS_LABEL[i.status]}. Tap to change">${STATUS_LABEL[i.status]}</button>
        <button class="del" data-act="del" aria-label="Remove ${esc(i.name)}">×</button>
      </li>`).join("")}</ul>`;
  }).join("")+`<p class="hint" style="margin-top:1rem">Tap a status to switch between Have, Low, Out and Not kept. Low and Out go on the shopping list. Tap an item's name to see every recipe that uses it.</p>`;
}
document.getElementById("stock-list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"); if(!b) return;
  if(b.dataset.act==="add-extra"){ addExtra(); return; }
  if(b.dataset.act==="dismiss-extra"){ try{ localStorage.setItem("kitchen-extra-dismissed","1"); }catch(_){} renderStock(); return; }
  const li=b.closest("li"); if(!li) return;
  const id=li.dataset.id, it=state.items.find(i=>i.id===id); if(!it) return;
  if(b.dataset.act==="recipes"){ showIngredient(USE_COUNT[it.key]?it.key:slug(it.name)); return; }
  if(b.dataset.act==="cycle"){ it.status=NEXT[it.status]||"have"; }
  else { state.items=state.items.filter(i=>i.id!==id); toast(it.name+" removed"); }
  persist(); render();
});

/* ---------- shopping view ---------- */
function renderShop(){
  const el=document.getElementById("shop-list");
  const need=state.items.filter(needBuy);
  if(!need.length){ el.innerHTML=`<div class="empty"><p>Nothing to buy. Items you mark Low or Out show up here.</p></div>`; return; }
  const sec=(title,list)=>list.length?`<h2>${title}<small>${list.length}</small></h2><ul>${list.sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`
    <li class="row" data-id="${i.id}"><span class="name">${esc(i.name)}<span class="loc">${esc(i.cat)}</span></span>
    <button class="bought" data-act="bought">Bought</button></li>`).join("")}</ul>`:"";
  el.innerHTML=sec("Out",need.filter(i=>i.status==="out"))+sec("Running low",need.filter(i=>i.status==="low"));
}
document.getElementById("shop-list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-act=bought]"); if(!b) return;
  const it=state.items.find(i=>i.id===b.closest("li").dataset.id); if(!it) return;
  it.status="have"; persist(); render(); toast(it.name+" back in stock");
});

const open=new Set();
const PROT={chicken:"chicken","chicken-breast":"chicken",mince:"beef",beef:"beef",pork:"pork",bacon:"pork",ham:"pork",sausage:"pork",chorizo:"pork",lamb:"lamb",fish:"fish",cod:"fish",salmon:"fish","smoked-salmon":"fish",tuna:"fish",shrimp:"fish"};

const USE_COUNT={};
RECIPES.forEach(r=>new Set(r.req.concat(r.opt||[])).forEach(k=>{ USE_COUNT[k]=(USE_COUNT[k]||0)+1; }));
const chip=(k,cls,label)=>`<button class="${cls}" data-act="ing" data-key="${esc(k)}">${esc(label)}</button>`;
function recipeHTML(r,have,idx){
  const missing=r.req.filter(k=>!have.has(k));
  const isOpen=open.has(idx);
  const sub=missing.length?`Missing ${missing.map(nameOf).join(", ")}`:`You have everything`;
  return `<div class="recipe" data-idx="${idx}">
    <button data-act="toggle" aria-expanded="${isOpen}"><span class="t"><strong>${esc(r.t)}<span class="cat">${CAT_SHORT[r.c]||""}</span>${r.veg?`<span class="cat">Veg</span>`:""}</strong><span>${esc(sub)}</span></span><span class="min">${r.m} min</span></button>
    <div class="body" ${isOpen?"":"hidden"}>
      <div class="ing">${r.req.map(k=>chip(k,have.has(k)?"ok":"miss",nameOf(k))).join("")}${(r.opt||[]).map(k=>chip(k,have.has(k)?"ok":"opt",nameOf(k)+" (optional)")).join("")}</div>
      <p class="hint small">Tap an ingredient to see every dish that uses it.</p>
      <ol>${r.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
      ${missing.length?`<button class="btn ghost" data-act="shop">Add missing to shopping</button>`:""}
    </div></div>`;
}

function ingKeyFromName(n){
  n=n.trim().toLowerCase(); if(!n) return null;
  if(BY_NAME[n]) return BY_NAME[n];
  const it=state.items.find(i=>i.name.toLowerCase()===n); if(it) return it.key;
  return Object.keys(USE_COUNT).find(k=>nameOf(k).toLowerCase()===n)
      || Object.keys(USE_COUNT).find(k=>nameOf(k).toLowerCase().includes(n)) || slug(n);
}
document.getElementById("ing-names").innerHTML=Object.keys(USE_COUNT).map(k=>nameOf(k)).sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="${esc(n)}">`).join("");
const ingIn=document.getElementById("ing-input");
function addIng(){
  const k=ingKeyFromName(ingIn.value); if(!k) return;
  if(!ingFilters.includes(k)) ingFilters.push(k);
  ingIn.value=""; ingIn.blur(); resetLimits(); renderRecipes();
}
ingIn.addEventListener("change",addIng);
ingIn.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addIng(); } });
document.getElementById("ing-pills").addEventListener("click",e=>{
  const b=e.target.closest("button[data-rm]"); if(!b) return;
  ingFilters=ingFilters.filter(k=>k!==b.dataset.rm); resetLimits(); renderRecipes();
});
function clearRecFilters(){
  recCat="all"; recQuery=""; recProt="any"; recTime="any"; ingFilters=[]; restOpen=false;
  document.getElementById("rec-search").value=""; document.getElementById("f-prot").value="any"; document.getElementById("f-time").value="any";
  document.querySelectorAll("#rec-chips button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.cat==="all"));
  resetLimits();
}
document.getElementById("clear-filters").addEventListener("click",()=>{ clearRecFilters(); renderRecipes(); });
function showIngredient(k){ clearRecFilters(); ingFilters=[k]; showTab("recipes"); }
function recMatches(r){
  if(recCat!=="all"&&r.c!==recCat) return false;
  if(recProt==="veg"&&!r.veg) return false;
  if(recProt!=="any"&&recProt!=="veg"&&!r.prot.has(recProt)) return false;
  if(recTime!=="any"&&r.m>+recTime) return false;
  if(ingFilters.length){ const all=new Set(r.req.concat(r.opt||[])); if(!ingFilters.every(k=>all.has(k))) return false; }
  if(!recQuery) return true;
  if(r.t.toLowerCase().includes(recQuery)) return true;
  return r.req.concat(r.opt||[]).some(k=>nameOf(k).toLowerCase().includes(recQuery));
}
function renderRecipes(){
  const have=haveKeys();
  const scored=RECIPES.map((r,i)=>({r,i,miss:r.req.filter(k=>!have.has(k)).length}));
  document.getElementById("rec-badge").textContent=scored.filter(x=>x.miss===0).length||"";
  if(tab!=="recipes") return;
  document.getElementById("ing-pills").innerHTML=ingFilters.map(k=>`<button class="pill" data-rm="${esc(k)}" aria-label="Remove ${esc(nameOf(k))}">With ${esc(nameOf(k))} <span aria-hidden="true">×</span></button>`).join("");
  const filtered=recCat!=="all"||!!recQuery||recProt!=="any"||recTime!=="any"||ingFilters.length>0;
  document.getElementById("clear-filters").hidden=!filtered;
  const shown=scored.filter(x=>recMatches(x.r));
  const byTitle=(a,b)=>a.r.t.localeCompare(b.r.t);
  const sorts={quick:(a,b)=>a.r.m-b.r.m||byTitle(a,b), az:byTitle};
  const s=sorts[recSort];
  const ready=shown.filter(x=>x.miss===0).sort(s||((a,b)=>a.r.m-b.r.m||byTitle(a,b)));
  const almost=shown.filter(x=>x.miss>0&&x.miss<=2).sort(s||((a,b)=>a.miss-b.miss||a.r.m-b.r.m));
  const rest=shown.filter(x=>x.miss>2).sort(s||((a,b)=>a.miss-b.miss||byTitle(a,b)));
  const list=(arr,sec)=>arr.slice(0,limits[sec]).map(x=>recipeHTML(x.r,have,x.i)).join("")+
    (arr.length>limits[sec]?`<button class="btn ghost showmore" data-act="more" data-sec="${sec}">Show more (${arr.length-limits[sec]} left)</button>`:"");
  document.getElementById("rec-hint").textContent=(filtered?`${shown.length} of ${RECIPES.length} recipes match.`:`${RECIPES.length} recipes.`)+" Matched against what you have or are running low on. Salt, pepper and oil are assumed. Amounts serve about 4 unless a recipe says otherwise.";
  if(!shown.length){ document.getElementById("recipe-list").innerHTML=`<p class="hint">No recipes match these filters.</p><button class="btn ghost showmore" data-act="clear">Clear all filters</button>`; return; }
  let html=`<h2>Ready to cook<small>${ready.length}</small></h2>`+(ready.length?list(ready,"ready"):`<p class="hint">Nothing complete yet. Check the close matches below.</p>`);
  if(almost.length) html+=`<h2>Missing one or two<small>${almost.length}</small></h2>`+list(almost,"almost");
  if(rest.length){
    if(ingFilters.length||recQuery) html+=`<h2>Need a bigger shop<small>${rest.length}</small></h2>`+list(rest,"rest");
    else html+=`<button class="btn ghost showmore" data-act="rest" aria-expanded="${restOpen}">${restOpen?"Hide":"Show"} ${rest.length} recipes that need a bigger shop</button>`+(restOpen?list(rest,"rest"):"");
  }
  document.getElementById("recipe-list").innerHTML=html;
}
document.getElementById("recipe-list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]"); if(!b) return;
  if(b.dataset.act==="more"){ limits[b.dataset.sec]+=PAGE*2; renderRecipes(); return; }
  if(b.dataset.act==="rest"){ restOpen=!restOpen; limits.rest=PAGE; renderRecipes(); return; }
  if(b.dataset.act==="clear"){ clearRecFilters(); renderRecipes(); return; }
  if(b.dataset.act==="ing"){ clearRecFilters(); ingFilters=[b.dataset.key]; renderRecipes(); window.scrollTo(0,0); return; }
  const idx=+b.closest(".recipe").dataset.idx;
  if(b.dataset.act==="toggle"){ open.has(idx)?open.delete(idx):open.add(idx); renderRecipes(); }
  else if(b.dataset.act==="shop"){
    const have=haveKeys();
    const miss=RECIPES[idx].req.filter(k=>!have.has(k));
    miss.forEach(k=>{ const ex=state.items.find(i=>i.key===k); if(ex) ex.status="out"; else { const c=BY_KEY[k]; state.items.push({id:uid(),key:k,name:c?c.name:k,cat:c?c.cat:"Other",loc:c?c.loc:"pantry",status:"out"}); } });
    persist(); render(); toast(miss.length+" added to shopping");
  }
});

/* ---------- backup ---------- */
document.getElementById("export-btn").onclick=async()=>{
  const json=JSON.stringify({app:"kitchen",version:1,saved:new Date().toISOString(),items:state.items},null,1);
  const name="kitchen-backup-"+new Date().toISOString().slice(0,10)+".json";
  const file=new File([json],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Kitchen backup"}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
document.getElementById("import-file").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.items)) throw 0;
    if(state.items.length&&!confirm("Replace your current stock with this backup?")) return;
    state={items:d.items.filter(i=>i&&i.name).map(i=>({id:i.id||uid(),key:i.key||slug(i.name),name:String(i.name),cat:i.cat||"Other",loc:i.loc||"pantry",status:["have","low","out","none"].includes(i.status)?i.status:"have"}))};
    persist(); render(); toast("Backup restored");
  }catch(err){ toast("That file isn't a Kitchen backup"); }
};

/* ---------- render ---------- */
function render(){
  const need=state.items.filter(needBuy).length;
  document.getElementById("shop-badge").textContent=need||"";
  if(tab==="stock") renderStock();
  if(tab==="shop") renderShop();
  renderRecipes();
}
render();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
