<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121C16" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1E8; --paper:#F8FAF4; --ink:#1F3326; --muted:#66756A; --line:#CDD6C6;
  --accent:#D99A1E; --have:#3F7D50; --low:#C98A12; --out:#A8473B; --on-accent:#1F3326;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121C16; --paper:#1A261F; --ink:#E4ECDF; --muted:#93A396; --line:#2E3D33;
    --accent:#E8B33C; --have:#6DB37F; --low:#E8B33C; --out:#E07A6C; --on-accent:#121C16;
  }
}
:root[data-theme="dark"]{
  --bg:#121C16; --paper:#1A261F; --ink:#E4ECDF; --muted:#93A396; --line:#2E3D33;
  --accent:#E8B33C; --have:#6DB37F; --low:#E8B33C; --out:#E07A6C; --on-accent:#121C16;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.4; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; overscroll-behavior-y:none;
}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
main{max-width:640px; margin:0 auto; padding:1.5rem 1.1rem calc(6rem + env(safe-area-inset-bottom,0px))}
header{display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; margin-bottom:1.25rem}
h1{font-size:clamp(2.6rem,11vw,3.6rem); font-weight:800; letter-spacing:-.03em; line-height:.9; margin:0}
#sync{font-size:.8rem; color:var(--muted); text-align:right}
.view[hidden]{display:none}

/* add bar */
.add{display:flex; gap:.5rem; margin-bottom:.9rem}
.add input{-webkit-user-select:text; user-select:text; flex:1; min-width:0; background:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:.65rem .8rem}
.add select{background:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:.6rem .4rem}
.btn{background:var(--ink); color:var(--bg); border:0; border-radius:12px; padding:.65rem 1rem; font-weight:600}
.btn.ghost{background:var(--paper); color:var(--ink); border:1.5px solid var(--line)}
.btn.accent{background:var(--accent); color:var(--on-accent)}
.chips{display:flex; gap:.4rem; overflow-x:auto; margin-bottom:1.25rem; padding-bottom:.2rem}
.chips button{flex:none; background:var(--paper); border:1.5px solid var(--line); border-radius:999px; padding:.35rem .85rem; font-size:.92rem}
.chips button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chips .edit{margin-left:auto}

h2{font-size:1.15rem; font-weight:600; margin:1.5rem 0 .25rem; padding-bottom:.35rem; border-bottom:2px solid var(--ink); display:flex; justify-content:space-between; align-items:baseline}
h2 small{font-weight:400; font-size:.85rem; color:var(--muted)}
ul{list-style:none; margin:0; padding:0}
.row{display:flex; align-items:center; gap:.6rem; border-bottom:1px solid var(--line); min-height:52px}
.row .name{flex:1; padding:.55rem 0}
.row .loc{font-size:.78rem; color:var(--muted); display:block}
.status{
  flex:none; width:5.4rem; border-radius:999px; border:1.5px solid currentColor;
  background:none; padding:.3rem 0; font-size:.88rem; font-weight:600; text-align:center;
}
.status.have{color:var(--have)}
.status.low{color:var(--low)}
.status.out{color:var(--out); border-style:dashed}
.status.none{color:var(--muted); border-style:dotted; font-weight:400}
.nm{background:none; border:0; padding:0; text-align:left; font:inherit; color:inherit; cursor:pointer}
.banner{background:var(--paper); border:1.5px solid var(--accent); border-radius:16px; padding:1rem 1.1rem; margin-bottom:1rem}
.banner p{margin:0 0 .75rem}
.banner .btns{display:flex; flex-wrap:wrap; gap:.5rem}
.filters{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.5rem; margin:-.5rem 0 .75rem}
.filters label{display:flex; flex-direction:column; gap:.15rem; font-size:.75rem; color:var(--muted)}
.filters select{width:100%; min-width:0; background:var(--paper); border:1.5px solid var(--line); border-radius:10px; padding:.45rem .4rem; font-size:.9rem; color:var(--ink)}
.pills{display:flex; flex-wrap:wrap; gap:.4rem; margin:-.25rem 0 .75rem}
.pills:empty{display:none}
.pill{background:var(--ink); color:var(--bg); border:0; border-radius:999px; padding:.35rem .85rem; font-size:.9rem}
.linkbtn{background:none; border:0; color:var(--ink); text-decoration:underline; padding:.2rem 0; font-size:.9rem; margin:0 0 .5rem}
.linkbtn[hidden]{display:none}
.ing button{font-size:.85rem; border-radius:6px; padding:.15rem .5rem; border:1px solid var(--line); background:none}
.hint.small{font-size:.78rem; margin:-.35rem 0 .6rem}
.del{flex:none; background:none; border:0; color:var(--out); font-size:1.4rem; width:2.2rem; height:2.2rem; display:none}
body.editing .del{display:block}
.empty{background:var(--paper); border:1.5px dashed var(--line); border-radius:16px; padding:1.25rem; margin-top:.5rem}
.empty p{margin:0 0 1rem; color:var(--muted)}
.empty .btns{display:flex; flex-wrap:wrap; gap:.5rem}
.hint{font-size:.88rem; color:var(--muted); margin:.25rem 0 0}

/* shopping */
.shop .row .name{cursor:default}
.shop .bought{flex:none; background:none; border:1.5px solid var(--line); border-radius:999px; padding:.3rem .8rem; font-size:.88rem}

/* recipes */
.recipe{border-bottom:1px solid var(--line)}
.recipe > button{width:100%; display:flex; align-items:center; gap:.75rem; text-align:left; background:none; border:0; padding:.8rem 0}
.recipe .t{flex:1}
.recipe .t strong{display:block; font-weight:600}
.recipe .t span{font-size:.85rem; color:var(--muted)}
.recipe .min{font-size:.85rem; color:var(--muted); flex:none}
.recipe .body{padding:0 0 1rem}
.recipe .body[hidden]{display:none}
.ing{display:flex; flex-wrap:wrap; gap:.35rem; margin:.25rem 0 .75rem}
.ing span{font-size:.85rem; border-radius:6px; padding:.15rem .5rem; border:1px solid var(--line)}
.ing .ok{color:var(--have); border-color:currentColor}
.ing .miss{color:var(--out); border-color:currentColor; border-style:dashed}
.ing .opt{color:var(--muted)}
ol{margin:0 0 .75rem; padding-left:1.25rem}
ol li{margin-bottom:.35rem}
details.more summary{cursor:pointer; color:var(--muted); padding:.8rem 0; list-style-position:inside}
.ask{background:var(--paper); border:1.5px solid var(--line); border-radius:16px; padding:1rem 1.1rem; margin-top:1.75rem}
.ask h3{margin:0 0 .25rem; font-size:1.05rem}
.ask p{margin:0 0 .75rem; color:var(--muted); font-size:.92rem}
.ask .actions{display:flex; gap:.5rem}
#ai-out{margin-top:.75rem}
#ai-out .recipe:last-child{border-bottom:0}

.backup{margin-top:2.5rem}
.backup .btns{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.75rem}
label.btn{display:inline-block; cursor:pointer}
.search{width:100%; background:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:.65rem .8rem; margin-bottom:.75rem; -webkit-user-select:text; user-select:text}
.recipe .cat{font-size:.75rem; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 .35rem; margin-left:.35rem; font-weight:400; vertical-align:1px}
.showmore{display:block; width:100%; margin:.75rem 0 0; text-align:center}
/* tab bar */
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  background:var(--paper); border-top:1.5px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav .inner{max-width:640px; margin:0 auto; display:flex}
nav button{flex:1; background:none; border:0; padding:.55rem 0 .6rem; display:flex; flex-direction:column; align-items:center; gap:.15rem; font-size:.8rem; color:var(--muted); position:relative}
nav button svg{width:24px; height:24px}
nav button[aria-current="page"]{color:var(--ink); font-weight:600}
nav .badge{position:absolute; top:.3rem; left:calc(50% + 6px); background:var(--accent); color:var(--on-accent); font-size:.7rem; font-weight:600; border-radius:999px; min-width:1.2rem; padding:0 .3rem; line-height:1.2rem}
nav .badge:empty{display:none}
#toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:calc(5rem + env(safe-area-inset-bottom,0px));
  background:var(--ink); color:var(--bg); padding:.55rem 1rem; border-radius:999px; font-size:.92rem;
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:6; white-space:nowrap
}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Stock</h1>
    <div id="sync">Saved on this phone</div>
  </header>

  <!-- STOCK -->
  <section class="view" id="v-stock">
    <form class="add" id="add-form" autocomplete="off">
      <input id="add-name" placeholder="Add or search an item" aria-label="Item name" list="catalog-names">
      <select id="add-loc" aria-label="Where it's stored">
        <option value="pantry">Pantry</option>
        <option value="fridge">Fridge</option>
        <option value="freezer">Freezer</option>
      </select>
      <button class="btn" type="submit">Add</button>
    </form>
    <datalist id="catalog-names"></datalist>
    <div class="chips" id="loc-chips">
      <button data-loc="all" aria-pressed="true">All</button>
      <button data-loc="pantry" aria-pressed="false">Pantry</button>
      <button data-loc="fridge" aria-pressed="false">Fridge</button>
      <button data-loc="freezer" aria-pressed="false">Freezer</button>
      <button id="hide-none" aria-pressed="false">Hide not kept</button>
      <button class="edit" id="edit-btn" aria-pressed="false">Edit</button>
    </div>
    <div id="stock-list"></div>
    <div class="backup">
      <h2>Backup</h2>
      <p class="hint">Your stock is stored on this phone. Save a backup file now and then, or use it to move your list to another device.</p>
      <div class="btns">
        <button class="btn ghost" id="export-btn">Save backup</button>
        <label class="btn ghost" for="import-file">Restore backup</label>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </div>
    </div>
  </section>

  <!-- SHOPPING -->
  <section class="view shop" id="v-shop" hidden>
    <div id="shop-list"></div>
  </section>

  <!-- RECIPES -->
  <section class="view" id="v-recipes" hidden>
    <input id="rec-search" class="search" type="search" placeholder="Search recipes" aria-label="Search recipes" autocomplete="off">
    <input id="ing-input" class="search" list="ing-names" placeholder="Dishes with ingredient… (e.g. salmon)" aria-label="Show every dish with an ingredient" autocomplete="off">
    <datalist id="ing-names"></datalist>
    <div id="ing-pills" class="pills"></div>
    <div class="chips" id="rec-chips"></div>
    <div class="filters">
      <label><span>Protein</span><select id="f-prot">
        <option value="any">Any</option><option value="veg">Vegetarian</option><option value="chicken">Chicken</option>
        <option value="beef">Beef &amp; mince</option><option value="pork">Pork, bacon &amp; sausage</option>
        <option value="lamb">Lamb</option><option value="fish">Fish &amp; seafood</option></select></label>
      <label><span>Time</span><select id="f-time">
        <option value="any">Any</option><option value="15">15 min or less</option><option value="30">30 min or less</option>
        <option value="45">45 min or less</option><option value="60">1 hour or less</option></select></label>
      <label><span>Sort</span><select id="f-sort">
        <option value="best">Best match</option><option value="quick">Quickest</option><option value="az">A–Z</option></select></label>
    </div>
    <button class="linkbtn" id="clear-filters" hidden>Clear all filters</button>
    <p class="hint" id="rec-hint">Matched against what you have or are running low on. Salt, pepper and oil are assumed.</p>
    <div id="recipe-list"></div>
  </section>
</main>

<nav aria-label="Sections">
  <div class="inner">
    <button data-tab="stock" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 6h4M10 12h4M10 18h4"/></svg>
      Stock
    </button>
    <button data-tab="shop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      Shopping<span class="badge" id="shop-badge"></span>
    </button>
    <button data-tab="recipes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M9 4c0 1.5 1 1.5 1 3M13 4c0 1.5 1 1.5 1 3"/></svg>
      Recipes<span class="badge" id="rec-badge"></span>
    </button>
  </div>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

const STEPS={"Pasta al pomodoro": ["Bring a large pot of water to the boil and salt it well (about 1 tbsp per 2 litres).", "Thinly slice 3 garlic cloves. Warm 3 tbsp olive oil in a wide pan on medium-low and cook the garlic for 1–2 min until pale gold, not brown.", "Add 2 cans (800 g) chopped tomatoes and ½ tsp salt. Simmer for 15 min, stirring now and then, until thick and no longer watery.", "Meanwhile cook 400 g pasta until 1 min short of the packet time. Save a mug of the pasta water before draining.", "Tip the pasta into the sauce with a splash of pasta water and toss over the heat for 1 min until the sauce clings.", "Taste for salt, then serve with grated parmesan and basil or oregano if you have it."], "Aglio e olio": ["Cook 400 g spaghetti in well-salted boiling water until just al dente. Save a mug of pasta water.", "While it cooks, thinly slice 5 garlic cloves.", "Put 6 tbsp olive oil, the garlic and 1 tsp chili flakes in a cold wide pan, then heat on low for 4–5 min until the garlic is pale gold.", "Add the drained pasta and a ladle of pasta water. Toss hard over medium heat for 1–2 min until the oil and water turn into a glossy sauce.", "Add more pasta water if it looks dry. Finish with parmesan and a squeeze of lemon if you like."], "Chickpea curry": ["Finely chop 1 onion, 3 garlic cloves and a thumb of ginger if you have it.", "Heat 2 tbsp oil in a pot on medium. Fry the onion for 6–8 min until soft and golden, then add garlic and ginger for 1 min.", "Stir in 2 tbsp curry powder and fry for 30 seconds until fragrant.", "Add 1 can chopped tomatoes, 1 can coconut milk and 2 drained cans of chickpeas. Season with 1 tsp salt.", "Simmer uncovered for 15–20 min until thickened.", "Stir in 2 handfuls of spinach until wilted. Serve with rice."], "Red lentil soup": ["Chop 1 onion and 2 garlic cloves (and 1 carrot if using).", "Heat 2 tbsp oil in a pot. Soften the onion (and carrot) for 6 min, then add garlic, 2 tsp cumin and 2 tbsp tomato paste and fry for 1 min.", "Add 250 g rinsed red lentils and 1 litre stock. Bring to the boil, then simmer for 15–20 min until the lentils fall apart.", "Blend partly or fully, depending on how smooth you want it. Thin with a little water if it is too thick.", "Season with salt and lemon juice, and top with chili flakes."], "Egg fried rice": ["Use about 6 dl cold cooked rice (made the day before is best, as fresh rice turns mushy).", "Beat 3 eggs with a pinch of salt. Heat 1 tbsp oil in a wok or large pan on high, scramble the eggs softly and tip them out.", "Add 1 more tbsp oil, fry 2 chopped garlic cloves for 20 seconds, then add the rice. Press and toss for 3–4 min until hot and slightly crisp.", "Add 2 dl frozen peas and stir-fry for 2 min.", "Add 2–3 tbsp soy sauce and the eggs, toss and finish with a few drops of sesame oil."], "Chili con carne": ["Chop 1 onion and 3 garlic cloves.", "Brown 500 g mince in a hot pot with a little oil for 6–8 min, breaking it up, until well browned.", "Add onion and garlic, cook for 4 min, then stir in 2 tsp cumin, 2 tsp paprika and chili flakes to taste.", "Add 2 tbsp tomato paste, 2 cans chopped tomatoes and 1 drained can of beans. Season with salt.", "Simmer gently for 30–40 min with the lid half on, stirring now and then. Add a splash of water if it gets too thick.", "Serve with rice, sour cream and cheese."], "Chicken stir-fry": ["Start 3 dl rice cooking.", "Slice 500 g chicken thighs thinly and toss with 1 tbsp soy sauce and 1 tsp cornstarch.", "Heat 1 tbsp oil in a wok until smoking. Sear the chicken in one layer for 3–4 min until browned and cooked, then remove.", "Stir-fry 400 g broccoli or wok mix for 3 min with a splash of water.", "Add 2 chopped garlic cloves and 1 tbsp grated ginger for 30 seconds, then the chicken, 3 tbsp soy and 1 tbsp honey.", "Toss for 1 min until glossy and serve over the rice."], "Shakshuka": ["Chop 1 onion, 2 garlic cloves (and 1 bell pepper if using).", "Soften onion and pepper in 2 tbsp oil in a wide pan for 8 min on medium.", "Add garlic, 1 tsp cumin and 1 tsp paprika and cook for 1 min.", "Add 2 cans chopped tomatoes and ½ tsp salt. Simmer for 10–12 min until thick.", "Make 4–6 wells with a spoon and crack an egg into each. Cover and cook on low for 6–8 min until the whites are set and the yolks still soft.", "Serve straight from the pan with bread."], "Omelette": ["Beat 3 eggs with a pinch of salt until no streaks remain. Have fillings ready (grated cheese, wilted spinach or crisp bacon).", "Melt 1 tbsp butter in a non-stick pan on medium until foaming.", "Pour in the eggs and stir quickly with a spatula for 20 seconds, then let it set for 1 min.", "When the top is still slightly wet, add fillings on one half.", "Fold in half and slide onto a plate."], "Tuna tomato pasta": ["Cook 400 g pasta in salted water. Save a little pasta water.", "Fry 3 sliced garlic cloves in 3 tbsp olive oil on medium-low for 1–2 min.", "Add 1 can chopped tomatoes and simmer for 10 min.", "Stir in 2 drained cans of tuna, plus 1 tbsp capers and a handful of olives if you have them. Warm through for 2 min.", "Toss with the pasta and a splash of pasta water. Finish with lemon and chili flakes."], "Oatmeal": ["Serves 1. Put 1 dl oats, 2 dl milk (or half water) and a pinch of salt in a small pan.", "Bring to a simmer on medium, stirring.", "Cook for 4–5 min, stirring often, until thick and creamy. Add a splash more milk if it gets too stiff.", "Top with berries, honey, cinnamon or a spoon of peanut butter."], "Pancakes": ["Makes about 10 thin Norwegian pancakes. Whisk 2.5 dl flour, 1 pinch salt and 2.5 dl milk until smooth.", "Whisk in 2.5 dl more milk and 2 eggs. Rest for 10–15 min.", "Stir in 2 tbsp melted butter.", "Heat a frying pan on medium and add a little butter. Pour in about ½ dl batter and swirl to coat the pan thinly.", "Cook for 1–2 min until the edges lift and the underside is golden, flip and cook 30 seconds more.", "Serve with sugar, jam or berries."], "Crispy roast potatoes": ["Heat the oven to 220°C and put a tray with 4 tbsp oil in to heat.", "Peel 1 kg potatoes and cut into large chunks.", "Boil in salted water for 8 min, drain and leave to steam for 2 min.", "Shake the pot with the lid on to rough up the edges.", "Tip the potatoes carefully onto the hot tray, turn them in the oil and sprinkle with salt.", "Roast for 35–45 min, turning once, until golden and crisp. Add rosemary or garlic for the last 10 min."], "Coconut shrimp curry": ["Start 3 dl rice cooking.", "Soften 1 chopped onion in 2 tbsp oil for 6 min, then add 2 garlic cloves and 1 tbsp ginger for 1 min.", "Stir in 1 tbsp curry powder for 30 seconds.", "Pour in 1 can coconut milk and simmer for 5 min.", "Add 400 g peeled shrimp and cook for 3–4 min until pink. Do not overcook or they turn rubbery.", "Season with fish sauce or salt and lemon juice. Stir in spinach if using and serve with rice."], "Lemon butter fish": ["Pat 4 fish fillets dry with paper and season with salt.", "Heat 1 tbsp oil in a non-stick pan on medium-high. Fry the fish for 3 min without moving it until golden underneath.", "Flip carefully and add 2 tbsp butter and 1 sliced garlic clove.", "Spoon the foaming butter over the fish for 1–2 min until it flakes easily.", "Squeeze over half a lemon and serve with potatoes and peas."], "Spaghetti bolognese": ["Finely chop 1 onion, 2 garlic cloves and 1 carrot if using.", "Soften onion and carrot in 2 tbsp oil for 8 min.", "Turn up the heat, add 500 g mince and brown well for 6–8 min. Add garlic and 2 tbsp tomato paste and fry for 1 min.", "Add 2 cans chopped tomatoes, 1 tsp oregano, 1 bay leaf, 1 tsp salt and 1 dl water.", "Simmer on low for at least 30 min (longer is better), stirring now and then.", "Serve over 400 g cooked spaghetti with parmesan."], "Hummus": ["Drain 1 can of chickpeas but keep the liquid.", "Blend the chickpeas with 1 garlic clove, juice of 1 lemon, 1 tsp cumin and ½ tsp salt.", "With the blender running, add 3–4 tbsp olive oil and 3–4 tbsp ice-cold water or chickpea liquid.", "Blend for 2–3 min until very smooth. Taste and adjust lemon and salt.", "Spread in a bowl and top with olive oil and paprika."], "Potato and pea curry": ["Peel and dice 600 g potatoes into 2 cm cubes.", "Fry 1 chopped onion in 2 tbsp oil for 6 min, then add 2 garlic cloves and 1 tbsp ginger for 1 min.", "Stir in 1 tbsp curry powder (and ½ tsp turmeric) for 30 seconds.", "Add the potatoes, 1 can chopped tomatoes, 2 dl water and 1 tsp salt. Cover and simmer for 20 min until tender.", "Add 3 dl frozen peas for the last 5 min. Finish with garam masala and serve with rice."], "Garlic butter noodles": ["Cook 300 g noodles according to the packet. Save a little cooking water.", "Melt 3 tbsp butter in a wide pan on low and add 5 chopped garlic cloves. Cook gently for 2 min without browning.", "Add 2 tbsp soy sauce and the drained noodles with a splash of cooking water.", "Toss for 1 min until coated. Top with parmesan or chili flakes."], "Quick mac and cheese": ["Cook 300 g short pasta until just al dente.", "Melt 2 tbsp butter in a pan, stir in 2 tbsp flour and cook for 1 min.", "Gradually whisk in 5 dl milk. Simmer, stirring, for 3–4 min until thickened.", "Off the heat, stir in 200 g grated cheese until melted. Season with salt, pepper and paprika.", "Mix with the pasta and serve, or top with more cheese and grill for 5 min."], "Chicken in tomato sauce": ["Season 8 chicken thighs with salt and pepper.", "Brown them in 2 tbsp oil in a wide pan for 4 min per side, then set aside.", "Soften 1 chopped onion in the same pan for 6 min, then add 3 garlic cloves for 1 min.", "Add 2 cans chopped tomatoes, 1 tsp oregano and ½ tsp salt. Stir in olives or peppers if using.", "Return the chicken, cover and simmer for 25 min until cooked through.", "Serve with rice or pasta."], "Bean and tomato soup": ["Chop 1 onion, 2 garlic cloves and 1 carrot if using.", "Soften them in 2 tbsp oil for 8 min.", "Add 1 can chopped tomatoes, 1 drained can of beans and 1 litre stock.", "Simmer for 15 min.", "Add 1 dl small pasta and cook for 8–10 min until tender. Stir in spinach and serve with parmesan."], "Spaghetti carbonara": ["Cut 150 g bacon into small strips. Whisk 3 eggs (or 2 eggs and 2 yolks) with 60 g grated parmesan and lots of black pepper.", "Cook 400 g spaghetti in salted water. Save a mug of pasta water.", "Meanwhile fry the bacon on medium for 6–8 min until crisp and the fat has run out.", "Take the pan off the heat. Add the drained pasta and toss it in the fat.", "Wait 30 seconds, then pour in the egg mix and a splash of pasta water and toss quickly. The heat of the pasta should make it creamy, not scrambled.", "Loosen with more pasta water if needed and serve at once."], "Cacio e pepe": ["Cook 400 g spaghetti in a smaller amount of salted water than usual (so the water gets starchy). Save 3 dl pasta water.", "Finely grate 100 g parmesan into a bowl.", "Toast 2 tsp coarsely ground pepper in a dry pan for 30 seconds, then add a ladle of pasta water and a knob of butter.", "Add the drained pasta and toss for 1 min.", "Take the pan off the heat. Mix the cheese with a little cool pasta water to a paste, then toss it through the pasta until glossy. Add more water if needed."], "Pesto pasta": ["Cook 400 g pasta in salted water. Save a mug of pasta water.", "Mix 6–8 tbsp pesto with 3–4 tbsp hot pasta water in a large bowl.", "Add the drained pasta and toss until evenly coated and silky.", "Add halved tomatoes if using, and top with parmesan and toasted nuts."], "Creamy mushroom pasta": ["Slice 400 g mushrooms and chop 2 garlic cloves. Start cooking 400 g pasta.", "Heat 2 tbsp oil in a wide pan on high. Fry the mushrooms in one layer for 6–8 min until browned, without stirring too often.", "Turn the heat down, add a knob of butter, the garlic and thyme for 1 min.", "Pour in 3 dl cream and simmer for 3 min until slightly thickened. Season with salt and pepper.", "Toss with the pasta and a splash of pasta water. Top with parmesan and parsley."], "Pasta puttanesca": ["Start cooking 400 g pasta.", "Fry 3 sliced garlic cloves and a pinch of chili flakes in 3 tbsp olive oil for 1 min.", "Add 1 can chopped tomatoes, a handful of chopped olives and 2 tbsp capers.", "Simmer for 10 min until thick. It is salty already, so taste before adding salt.", "Toss with the pasta and some pasta water. Top with parsley."], "Penne arrabbiata": ["Start cooking 400 g penne.", "Warm 4 tbsp olive oil with 3 sliced garlic cloves and 1 tsp chili flakes on low for 2 min.", "Add 2 cans chopped tomatoes and ½ tsp salt.", "Simmer for 12–15 min until thick and rich.", "Toss with the penne and a splash of pasta water. Add parsley and parmesan."], "Bacon and tomato pasta (amatriciana-style)": ["Cut 150 g bacon into strips and slice 1 onion.", "Fry the bacon on medium for 5 min until crisp, then add the onion and cook for 5 min.", "Add a pinch of chili and 1 can chopped tomatoes. Simmer for 10 min.", "Cook 400 g pasta meanwhile and toss into the sauce with a splash of pasta water.", "Serve with grated cheese."], "Creamy tomato pasta": ["Finely chop 1 onion and 2 garlic cloves. Start cooking 400 g pasta.", "Soften them in 2 tbsp oil for 6 min.", "Stir in 3 tbsp tomato paste and fry for 1–2 min until it darkens.", "Add 2.5 dl cream and a ladle of pasta water. Simmer for 3 min until smooth.", "Toss with the pasta, add a pinch of chili flakes and serve with parmesan and basil."], "Lemon garlic shrimp pasta": ["Cook 400 g pasta. Save a mug of pasta water.", "Melt 2 tbsp butter with 1 tbsp oil and fry 3 sliced garlic cloves for 1 min.", "Add 400 g shrimp and cook for 2–3 min until pink.", "Add the zest and juice of 1 lemon and chili flakes.", "Toss in the pasta with a splash of pasta water until glossy. Top with parsley."], "Creamy salmon pasta": ["Cut 400 g salmon into 2 cm cubes. Start cooking 400 g pasta.", "Fry the salmon in 1 tbsp oil for 3 min until just cooked, then lift out.", "Add 2.5 dl cream, the zest of 1 lemon he zucchini with 2 garlic cloves in 3 tbsp olive oil for 6–8 min until soft and starting to brown.", "Add the zest and juice of 1 lemon.", "Toss with the pasta, a splash of pasta water and lots of parmesan."], "Broccoli and garlic pasta": ["Cut 1 head broccoli into small florets. Cook 400 g pasta, adding the broccoli for the last 4 min.", "Fry 3 sliced garlic cloves and chili flakes in 4 tbsp olive oil for 1–2 min.", "Add the drained pasta, broccoli and a ladle of pasta water.", "Stir hard, breaking up some broccoli into a sauce. Finish with parmesan and lemon."], "Sausage and tomato pasta": ["Squeeze the meat out of 400 g sausages. Start cooking 400 g pasta.", "Brown the sausage meat in 1 tbsp oil for 6 min, breaking it up.", "Add 1 chopped onion and 2 garlic cloves and cook for 4 min.", "Add 1 can chopped tomatoes and chili flakes. Simmer for 10 min, adding a splash of cream if you like.", "Toss with the pasta."], "Chorizo pasta": ["Slice 150 g chorizo. Start cooking 400 g pasta.", "Fry the chorizo in a dry pan for 3–4 min until the red oil runs.", "Add 2 garlic cloves for 30 seconds, then 1 can chopped tomatoes. Simmer for 10 min.", "Stir in spinach or a splash of cream if using.", "Toss with the pasta."], "Tuna pasta bake": ["Heat the oven to 200°C. Cook 400 g pasta for 2 min less than the packet says.", "Mix the pasta with 1 can chopped tomatoes, 2 drained cans of tuna and 1 can corn. Season.", "Tip into a baking dish and cover with 150 g grated cheese.", "Bake for 20 min until bubbling and golden."], "Classic lasagne": ["Meat sauce: brown 500 g mince, add 1 onion, 2 garlic cloves and 1 grated carrot. Add 2 cans tomatoes, 1 tsp oregano and salt, and simmer for 30 min.", "White sauce: melt 50 g butter, stir in 50 g flour, then whisk in 7 dl milk. Simmer for 5 min until thick. Season with salt and nutmeg.", "Heat the oven to 200°C.", "In a dish, layer meat sauce, lasagne sheets and white sauce. Repeat 3 times and finish with white sauce.", "Top with 150 g grated cheese and bake for 40 min until golden. Rest for 10 min before cutting."], "Lentil lasagne": ["Soften 1 onion, 2 garlic cloves and 1 carrot. Add 2 dl red lentils, 2 cans tomatoes, 3 dl water and oregano. Simmer for 20 min.", "Make a white sauce with 50 g butter, 50 g flour and 7 dl milk.", "Heat the oven to 200°C.", "Layer the lentil sauce, sheets and white sauce three times.", "Top with cheese and bake for 40 min."], "Spinach and ricotta-style lasagne": ["Thaw and squeeze 450 g spinach. Mix with 400 g cottage cheese, 1 garlic clove, nutmeg and salt.", "Simmer 2 cans tomatoes with garlic for 10 min.", "Heat the oven to 200°C.", "Layer tomato sauce, sheets and spinach mix three times, ending with tomato.", "Top with 200 g mozzarella and bake for 40 min."], "Pasta e fagioli": ["Soften 1 onion, 2 garlic cloves and 1 carrot in 2 tbsp oil for 8 min with a sprig of rosemary.", "Add 1 can tomatoes, 1 drained can of beans and 1 litre stock.", "Simmer for 10 min. Mash some of the beans against the side of the pot to thicken it.", "Add 2 dl small pasta and cook for 8–10 min, stirring so it does not stick.", "It should be thick and stewy. Serve with olive oil and parmesan."], "Pasta e ceci": ["Fry 2 sliced garlic cloves and rosemary in 3 tbsp olive oil for 1 min.", "Stir in 2 tbsp tomato paste and fry for 1 min.", "Add 2 drained cans of chickpeas and 1 litre stock. Simmer for 10 min, then mash about a third of the chickpeas.", "Add 2 dl small pasta and cook until tender and thick.", "Serve with chili flakes and parmesan."], "One-pot tomato pasta": ["Put 400 g spaghetti (broken in half), 1 can tomatoes, 1 sliced onion, 2 sliced garlic cloves and 8 dl stock in a wide pot.", "Bring to the boil and cook for 10–12 min, stirring often so it does not stick.", "When the pasta is cooked and the liquid has become a sauce, take it off the heat.", "Stir in spinach, basil and parmesan."], "Lentil bolognese": ["Soften 1 onion, 2 garlic cloves and 1 carrot in 2 tbsp oil for 8 min.", "Stir in 2 tbsp tomato paste for 1 min.", "Add 2 dl red lentils, 2 cans tomatoes, 4 dl water and oregano.", "Simmer for 25 min until thick, adding water if needed.", "Serve over 400 g pasta with parmesan."], "Ham and pea pasta": ["Cook 400 g pasta, adding 2 dl peas for the last 2 min.", "Warm 200 g diced ham in 2.5 dl cream for 3 min (fry some onion first if using).", "Toss with the pasta and parmesan. Season with pepper."], "Pasta with peas and bacon": ["Fry 150 g bacon strips until crisp.", "Cook 400 g pasta, adding 2 dl peas for the last 2 min.", "Toss the drained pasta with the bacon and fat, a ladle of pasta water and parmesan.", "Add a splash of cream for a richer sauce."], "Pasta primavera": ["Cut vegetables small. Cook 400 g pasta, adding broccoli and peas for the last 3 min.", "Fry 1 zucchini and 2 garlic cloves in olive oil for 5 min.", "Toss everything with lemon zest, parmesan and a splash of pasta water (or cream)."], "Pasta alla Norma (eggplant)": ["Cut 1 large eggplant into 2 cm cubes and salt it for 15 min, then pat dry.", "Fry it in 5 tbsp oil for 10 min until golden and soft.", "Add 2 garlic cloves and chili, then 1 can tomatoes. Simmer for 10 min.", "Toss with 400 g pasta and basil, and crumble feta over."], "Cauliflower and cheese pasta": ["Cook 300 g pasta with 1 small head of cauliflower in small florets.", "Melt 2 tbsp butter, add 2 tbsp flour, then whisk in 5 dl milk. Simmer for 3 min.", "Stir in 150 g cheese and 1 tsp mustard.", "Mix with the pasta and cauliflower. Grill with more cheese for 5 min if you like."], "Garlic butter pasta": ["Cook 400 g pasta. Save some pasta water.", "Melt 50 g butter on low with 5 sliced garlic cloves and cook for 3 min until soft and fragrant.", "Toss in the pasta, a ladle of pasta water and parmesan until glossy.", "Top with parsley and chili flakes."], "Creamy spinach pasta": ["Cook 400 g pasta.", "Fry 2 garlic cloves in butter, add 200 g spinach and stir until wilted.", "Add 2.5 dl cream and a pinch of nutmeg. Simmer for 2 min.", "Toss with the pasta and parmesan."], "Pasta salad with pesto and tomato": ["Cook 400 g short pasta, rinse under cold water and drain well.", "Toss with 5 tbsp pesto, 250 g halved cherry tomatoes and a ball of mozzarella in pieces.", "Add olives and basil. Season and serve cold or at room temperature."], "Gnocchi in tomato sauce": ["Simmer 1 can tomatoes with 2 garlic cloves and olive oil for 10 min. Season.", "Boil 500 g gnocchi in salted water until they float (2–3 min) and drain.", "Toss the gnocchi in the sauce.", "Top with mozzarella and grill for 5 min if you like. Finish with basil."], "Gnocchi with pesto": ["Fry 500 g gnocchi straight from the pack in 2 tbsp oil for 6–8 min until golden, or boil until they float.", "Toss with 5 tbsp pesto and a splash of water.", "Add peas or tomatoes and top with parmesan."], "Brown butter sage-style gnocchi": ["Fry 500 g gnocchi in 1 tbsp oil for 6 min until golden.", "Add 50 g butter and cook for 2 min until it smells nutty and turns light brown.", "Add a crushed garlic clove for the last 30 seconds.", "Finish with parmesan and lemon juice."], "Creamy spinach gnocchi": ["Fry 500 g gnocchi until golden (with bacon if using).", "Add 2 garlic cloves, 150 g spinach and 2 dl cream.", "Simmer for 2 min until the sauce coats the gnocchi.", "Top with parmesan."], "Gnocchi bake with sausage": ["Heat the oven to 200°C.", "Brown 400 g sliced sausage with 1 onion for 6 min.", "Add 1 can tomatoes and oregano and simmer for 5 min.", "Stir in 500 g uncooked gnocchi and tip into a dish.", "Top with mozzarella and bake for 20 min."], "Sheet-pan gnocchi with vegetables": ["Heat the oven to 220°C.", "Toss 500 g gnocchi, 1 zucchini, 1 bell pepper and 1 red onion (all in chunks) with 3 tbsp oil and salt on a tray.", "Spread out in one layer and roast for 25 min, turning halfway, until golden.", "Top with crumbled feta or a drizzle of pesto."], "Peanut noodles": ["Cook 300 g noodles, drain and rinse briefly.", "Whisk 4 tbsp peanut butter, 3 tbsp soy sauce, 1 grated garlic clove, juice of 1 lime and 4–5 tbsp hot water until smooth.", "Add sriracha to taste.", "Toss the noodles in the sauce. Top with spring onion and sesame seeds."], "Sesame noodles": ["Cook 300 g noodles and rinse.", "Mix 2 tbsp sesame oil, 3 tbsp soy, 1 tbsp rice vinegar, 1 tsp honey, 1 grated garlic clove and chili flakes.", "Toss the noodles in the dressing.", "Top with spring onion and sesame seeds. Eat warm or cold."], "Simple pad thai": ["Soak 250 g rice noodles in hot water for 8–10 min until soft but still firm, then drain.", "Mix 3 tbsp fish sauce, juice of 1 lime and 2 tbsp brown sugar.", "Stir-fry 300 g shrimp or tofu in a hot wok with oil for 2–3 min, then push to one side.", "Crack 2 eggs into the space, scramble and mix in.", "Add the noodles and sauce and toss for 2 min until hot.", "Top with chopped peanuts, spring onion and lime wedges."], "Chicken chow mein": ["Cook 300 g noodles, rinse and toss with a little oil.", "Slice 400 g chicken thin. Stir-fry in a very hot wok for 4 min, then remove.", "Stir-fry ¼ shredded cabbage and 1 carrot in strips for 3 min.", "Add the noodles, chicken, 3 tbsp soy and 2 tbsp oyster sauce.", "Toss on high heat for 2 min. Top with spring onion."], "Beef chow mein": ["Cook 300 g noodles and rinse.", "Slice 400 g beef very thin and sear in a smoking-hot wok for 1–2 min, then remove.", "Stir-fry cabbage and carrot for 3 min.", "Add the noodles, beef, 3 tbsp soy and 2 tbsp oyster sauce and toss for 2 min."], "Vegetable lo mein": ["Cook 300 g noodles.", "Stir-fry broccoli, carrot and mushrooms in a hot wok for 4 min.", "Add 2 garlic cloves for 30 seconds.", "Add the noodles, 3 tbsp soy and 1 tsp sesame oil and toss well."], "Teriyaki chicken": ["Start 3 dl rice cooking. Mix 4 tbsp soy, 2 tbsp honey, 1 grated garlic clove and 1 tsp ginger.", "Fry 8 chicken thighs skin- or smooth-side down in 1 tbsp oil for 6 min until golden.", "Flip and cook for 5 more min.", "Pour in the sauce and simmer, turning the chicken, for 2–3 min until sticky and glossy.", "Slice and serve over rice with broccoli and sesame seeds."], "Teriyaki salmon": ["Start 3 dl rice cooking. Mix 3 tbsp soy and 2 tbsp honey (plus ginger and garlic).", "Fry 4 salmon fillets skin-side down in oil on medium-high for 4 min until crisp.", "Flip and cook for 2 min.", "Pour in the sauce and spoon it over the salmon for 1 min until glazed.", "Serve with rice and sesame seeds."], "Teriyaki tofu": ["Press 400 g tofu between paper for 10 min, cut into cubes and toss in 2 tbsp cornstarch.", "Fry in 3 tbsp oil on medium-high, turning, for 8 min until crisp all over.", "Add 3 tbsp soy, 2 tbsp honey and 1 garlic clove and toss until glazed.", "Serve with rice and broccoli."], "Sweet and sour chicken": ["Start the rice. Mix 3 tbsp ketchup, 2 tbsp vinegar, 2 tbsp sugar, 1 tbsp soy, 1 tbsp cornstarch and 1 dl pineapple juice.", "Cut 500 g chicken into pieces and fry in oil for 5–6 min until golden and cooked.", "Add 1 bell pepper and 1 onion in chunks and stir-fry for 3 min.", "Add 1 can drained pineapple and the sauce.", "Stir until it bubbles and thickens, about 1 min. Serve with rice."], "Sweet and sour pork": ["Cut 500 g pork into cubes, season and toss in 3 tbsp cornstarch.", "Fry in 1 cm oil for 5 min until crisp, then drain on paper.", "Stir-fry pepper and onion for 3 min.", "Add pineapple, 3 tbsp ketchup, 2 tbsp vinegar, 2 tbsp sugar and a splash of water and bring to the boil.", "Toss the pork through and serve with rice."], "Kung pao chicken": ["Start the rice. Mix 3 tbsp soy, 1 tbsp vinegar, 1 tbsp honey and 1 tsp cornstarch.", "Stir-fry 500 g diced chicken in a hot wok for 5 min until cooked.", "Add 2 garlic cloves, ginger and 1 tsp chili flakes for 30 seconds.", "Pour in the sauce and toss until glossy.", "Stir in a handful of peanuts and spring onion."], "Garlic shrimp stir-fry": ["Start the rice.", "Stir-fry broccoli florets in a hot wok with oil and a splash of water for 3 min.", "Add 400 g shrimp and 3 chopped garlic cloves and cook for 2–3 min until pink.", "Season with 2 tbsp soy and 1 tbsp oyster sauce. Serve with rice."], "Beef and broccoli": ["Slice 400 g beef thin, toss with 1 tbsp soy and 1 tsp cornstarch.", "Sear in a smoking-hot wok for 1–2 min and remove.", "Stir-fry broccoli with a splash of water for 3 min, add 2 garlic cloves and ginger.", "Return the beef with 3 tbsp oyster sauce, 1 tbsp soy and 3 tbsp water.", "Toss for 1 min and serve with rice."], "Ginger pork stir-fry": ["Slice 400 g pork very thin.", "Stir-fry in a hot wok for 3 min until browned.", "Add 2 tbsp grated ginger and 2 garlic cloves for 30 seconds.", "Add 3 tbsp soy and 1 tbsp honey (and shredded cabbage) and toss for 2 min.", "Top with spring onion and serve with rice."], "Tofu and vegetable stir-fry": ["Cube 400 g firm tofu, pat dry and fry in oil for 8 min until golden. Remove.", "Stir-fry broccoli, pepper and carrot for 4 min.", "Add 2 garlic cloves, then the tofu, 3 tbsp soy and 1 tsp sesame oil.", "Toss and serve with rice."], "Crispy sweet chili tofu": ["Cube 400 g tofu, pat dry and toss in 3 tbsp cornstarch and salt.", "Fry in 3 tbsp oil for 8–10 min, turning, until crisp.", "Toss in 5 tbsp sweet chili sauce.", "Serve with rice, spring onion and sesame seeds."], "Thai red curry chicken": ["Start the rice. Slice 500 g chicken and 1 bell pepper.", "Fry 3 tbsp red curry paste in 1 tbsp oil for 1 min until fragrant.", "Add the chicken and stir for 2 min to coat.", "Pour in 1 can coconut milk and simmer for 12–15 min, adding the pepper halfway.", "Season with 1 tbsp fish sauce and lime juice. Top with basil."], "Thai green curry": ["Start the rice. Fry 3 tbsp green curry paste in oil for 1 min.", "Add 500 g sliced chicken and stir for 2 min.", "Add 1 can coconut milk and 1 dl water and simmer for 10 min.", "Add zucchini or green beans and cook for 5 min.", "Season with fish sauce and lime. Serve with rice and basil."], "Red curry shrimp": ["Fry 2 tbsp red curry paste in oil for 1 min.", "Add 1 can coconut milk and simmer for 5 min.", "Add 400 g shrimp and sliced pepper and cook for 3–4 min.", "Finish with lime juice and fish sauce. Serve with rice."], "Red curry tofu with vegetables": ["Fry 400 g cubed tofu until golden, set aside.", "Fry 3 tbsp curry paste for 1 min, add 1 can coconut milk.", "Add broccoli and pepper and simmer for 8 min.", "Return the tofu, add lime and serve with rice."], "Thai basil chicken": ["Start the rice. Fry 3 garlic cloves and 1–2 sliced chilies in oil for 30 seconds.", "Add 500 g chicken or pork mince and stir-fry for 5 min until browned.", "Add 1 tbsp soy, 1 tbsp fish sauce, 1 tbsp oyster sauce and 1 tsp sugar.", "Stir in a big handful of basil until wilted.", "Serve over rice with a crispy fried egg."], "Chicken satay with peanut sauce": ["Cut 500 g chicken into strips, toss with 2 tbsp soy and 1 tsp curry powder. Rest for 10 min.", "Fry or grill for 6–8 min until charred and cooked.", "For the sauce, simmer 4 tbsp peanut butter, 2 dl coconut milk, 1 tbsp soy, 1 garlic clove and lime juice for 3 min.", "Serve with rice and the sauce."], "Chicken fried rice": ["Use 6 dl cold cooked rice.", "Fry 300 g diced chicken in a hot wok for 5 min, then push aside.", "Scramble 2 eggs in the space.", "Add the rice and peas and stir-fry for 4 min until hot.", "Season with 3 tbsp soy and top with spring onion."], "Shrimp fried rice": ["Use 6 dl cold cooked rice.", "Fry 300 g shrimp with garlic for 2 min, then remove.", "Scramble 2 eggs, then add the rice and stir-fry for 4 min.", "Add peas, the shrimp and 3 tbsp soy and toss."], "Pineapple fried rice": ["Use 6 dl cold cooked rice.", "Scramble 2 eggs in a hot wok, then add the rice and 1 tsp curry powder.", "Stir-fry for 3 min, then add 1 can drained pineapple and diced ham.", "Season with soy and top with nuts and spring onion."], "Korean beef bowl": ["Start 3 dl rice cooking.", "Brown 500 g mince in a hot pan for 6 min.", "Add 3 garlic cloves and 1 tbsp ginger for 1 min.", "Add 4 tbsp soy, 2 tbsp brown sugar and 1 tsp sesame oil and simmer for 2 min.", "Serve over rice with spring onion and cucumber."], "Bibimbap-style rice bowl": ["Cook 3 dl rice.", "Sauté 200 g spinach with garlic and 2 carrots in strips separately, each for 2–3 min, and season with soy and sesame oil.", "Brown 300 g mince with soy if using.", "Fry an egg per person, keeping the yolk runny.", "Top bowls of rice with the vegetables, mince, egg and sriracha. Mix before eating."], "Honey garlic chicken": ["Start the rice. Season 600 g chicken pieces.", "Brown in oil for 6–8 min until golden and almost cooked.", "Add 4 chopped garlic cloves for 30 seconds.", "Add 4 tbsp honey and 3 tbsp soy and simmer for 3 min until sticky.", "Top with sesame seeds and serve with rice."], "Sesame chicken": ["Cut 500 g chicken into pieces and toss in 4 tbsp cornstarch with salt.", "Fry in 1 cm oil for 6 min until crisp. Drain.", "Simmer 3 tbsp soy, 3 tbsp honey and 1 garlic clove for 1 min.", "Toss the chicken in the sauce with 2 tbsp sesame seeds. Serve with rice."], "Orange chicken": ["Toss 500 g chicken pieces in 4 tbsp cornstarch and fry until crisp.", "Simmer the juice and zest of 2 oranges, 3 tbsp soy, 2 tbsp sugar, garlic and ginger for 3 min.", "Thicken with 1 tsp cornstarch in a little water.", "Toss the chicken through and serve with rice."], "Mapo-style tofu with mince": ["Brown 250 g mince in oil until crisp.", "Add 2 garlic cloves, ginger and 1 tsp chili flakes for 1 min.", "Add 3 tbsp soy and 2.5 dl water and bring to a simmer.", "Add 400 g cubed soft tofu and simmer gently for 5 min.", "Thicken with 1 tsp cornstarch in water. Serve with rice and spring onion."], "Dan dan-style noodles": ["Fry 250 g mince in oil until crisp, then add 2 garlic cloves and 1 tbsp soy.", "In bowls, mix 2 tbsp peanut butter, 2 tbsp soy, 1 tsp sesame oil and chili oil.", "Cook 300 g noodles and add a ladle of cooking water to the bowls.", "Add the noodles, toss with the sauce and top with mince and spring onion."], "Chicken katsu curry": ["Start the rice. Flatten 2 chicken breasts to 1.5 cm.", "Coat in flour, beaten egg and breadcrumbs.", "Fry in 1 cm oil for 4 min per side until golden and cooked through.", "For the sauce, soften 1 onion and 1 carrot, add 2 tbsp curry powder and 1 tbsp flour, then 4 dl water and 1 tsp honey. Simmer for 10 min and blend.", "Slice the chicken and serve on rice with the sauce."], "Japanese-style curry": ["Brown 500 g chicken pieces in oil.", "Add 1 onion, 2 potatoes and 2 carrots in chunks and fry for 3 min.", "Add 7 dl water and simmer for 20 min until the vegetables are tender.", "In a small pan, cook 3 tbsp butter, 3 tbsp flour and 2 tbsp curry powder for 2 min.", "Stir this roux into the curry with 1 tbsp honey and 1 tbsp soy. Simmer for 5 min until thick. Serve with rice."], "Yakisoba": ["Cook 300 g noodles and rinse.", "Fry 300 g thinly sliced pork in a hot pan for 3 min.", "Add ¼ shredded cabbage and 1 carrot and stir-fry for 3 min.", "Add the noodles with 2 tbsp worcestershire, 2 tbsp soy and 1 tbsp ketchup. Toss for 2 min."], "Singapore noodles": ["Soak 250 g thin rice noodles in hot water for 5 min and drain.", "Stir-fry 300 g shrimp (or chicken) and 1 sliced pepper in a hot wok for 3 min.", "Push aside and scramble 2 eggs.", "Add the noodles, 2 tsp curry powder and 3 tbsp soy. Toss well for 2 min with a splash of water.", "Top with spring onion."], "Vietnamese noodle bowl": ["Cook 250 g rice noodles, rinse in cold water and drain.", "Dressing: 3 tbsp fish sauce, 3 tbsp lime juice, 2 tbsp sugar and 4 tbsp water.", "Fry or grill 400 g sliced chicken until cooked.", "Fill bowls with noodles, cucumber, grated carrot and chicken.", "Top with herbs and peanuts and pour over the dressing."], "Thai peanut chicken bowl": ["Cook the rice. Fry 500 g sliced chicken for 6 min.", "Whisk 4 tbsp peanut butter, 2 tbsp soy, lime juice and hot water to a pourable sauce.", "Shred cabbage and carrot.", "Fill bowls with rice, vegetables and chicken. Pour over the sauce and add cilantro."], "Five-spice pork with rice": ["Rub 500 g pork fillet with 1 tsp five-spice, salt and 1 tbsp honey.", "Sear in an ovenproof pan on all sides for 4 min.", "Roast at 200°C for 12–15 min until just cooked. Rest for 5 min.", "Slice and serve with rice, greens and a drizzle of soy."], "Egg and tomato stir-fry": ["Beat 4 eggs with salt. Cut 4 tomatoes into wedges.", "Scramble the eggs softly in oil and tip out.", "Fry the tomatoes with 1 tsp sugar for 3 min until juicy.", "Return the eggs, add a dash of soy and serve over rice."], "Ginger soy salmon with noodles": ["Cook 300 g noodles.", "Fry 4 salmon pieces skin-side down for 4 min, flip for 2 min.", "Add 3 tbsp soy, 1 tbsp honey and 1 tbsp grated ginger and spoon over to glaze.", "Serve with the noodles, broccoli and spring onion."], "Chicken lettuce wraps": ["Brown 500 g chicken mince for 5 min.", "Add 2 garlic cloves and 1 tbsp ginger for 1 min.", "Add 3 tbsp soy and 1 tbsp honey and cook for 2 min.", "Spoon into lettuce leaves and top with spring onion."], "Coconut lentil dal with spinach": ["Soften 1 onion, 2 garlic cloves and ginger in oil for 6 min.", "Add 1 tbsp curry powder for 30 seconds.", "Add 2.5 dl red lentils, 1 can coconut milk and 4 dl water.", "Simmer for 20 min, stirring often, until thick.", "Stir in spinach and lime juice. Serve with rice."], "Prawn laksa-style noodle curry": ["Fry 3 tbsp curry paste in oil for 1 min.", "Add 1 can coconut milk and 5 dl stock and simmer for 5 min.", "Add 300 g shrimp and cook for 3 min.", "Pour over cooked noodles in bowls. Finish with lime, fish sauce and spring onion."], "Chicken and cashew stir-fry": ["Stir-fry 500 g diced chicken for 5 min.", "Add 1 sliced pepper and cook for 2 min.", "Add 2 garlic cloves, 2 tbsp soy and 2 tbsp oyster sauce.", "Toss with a handful of toasted nuts and serve with rice."], "Crispy pork belly-style bites": ["Cut 600 g pork into 3 cm chunks. Rub with 1 tsp five-spice and 1 tsp salt.", "Roast on a rack at 220°C for 30–35 min until crisp.", "Toss with 2 tbsp soy, 1 tbsp honey and a crushed garlic clove.", "Serve with rice."], "Steamed fish with ginger and soy": ["Put 4 fish fillets on a heatproof plate and scatter over thin slices of ginger.", "Steam over simmering water, or bake covered at 200°C, for 8–10 min until it flakes.", "Pour over 3 tbsp soy, top with spring onion, then drizzle 2 tbsp smoking-hot oil over the top.", "Serve with rice."], "Udon-style noodle stir-fry with beef": ["Sear 300 g thin beef strips in a hot wok for 1–2 min, then remove.", "Fry mushrooms and garlic for 3 min.", "Add 300 g cooked thick noodles, the beef and 3 tbsp soy.", "Toss and top with spring onion."], "Tofu satay noodles": ["Fry 400 g cubed tofu until golden.", "Cook 300 g noodles with broccoli.", "Whisk 4 tbsp peanut butter, 2 tbsp soy, lime and hot water.", "Toss everything together."], "Chicken teriyaki rice bowl": ["Cook the rice. Make teriyaki chicken (fry chicken, glaze with 3 tbsp soy and 2 tbsp honey).", "Slice cucumber and avocado.", "Fill bowls with rice, chicken and vegetables and sprinkle with sesame seeds."], "Salmon poke-style bowl": ["Cook 3 dl rice and let it cool slightly.", "Cube 400 g salmon. Use sushi-grade if eating raw, otherwise pan-fry it first.", "Toss with 2 tbsp soy and 1 tsp sesame oil.", "Top the rice with salmon, cucumber, avocado, spring onion and sesame seeds."], "Spicy shrimp noodles": ["Cook 300 g noodles.", "Fry 300 g shrimp and 2 garlic cloves for 3 min.", "Add 2 tbsp sriracha, 2 tbsp soy and lime juice.", "Toss with the noodles and top with spring onion."], "Mongolian beef": ["Slice 500 g beef thin and toss in 3 tbsp cornstarch.", "Fry in hot oil in batches for 2 min until crisp, then remove.", "Simmer 4 tbsp soy, 3 tbsp brown sugar, garlic, ginger and 1 dl water for 2 min.", "Toss the beef in the sauce with spring onion and serve with rice."], "Cashew vegetable curry": ["Soften 1 onion and garlic in oil, then add 2 tbsp curry powder.", "Add 1 can coconut milk, broccoli and cauliflower florets.", "Simmer for 15 min until tender.", "Stir in toasted nuts and serve with rice."], "Vegetable fried noodles": ["Cook 300 g noodles. Scramble 2 eggs and set aside.", "Stir-fry shredded cabbage and carrot for 4 min.", "Add the noodles, eggs and 3 tbsp soy. Top with spring onion."], "Thai fish cakes with sweet chili": ["Blend 500 g white fish with 2 tbsp curry paste, 1 egg and ½ tsp salt until sticky.", "Mix in finely sliced green beans.", "Shape small flat cakes with wet hands.", "Fry in oil for 2 min per side until golden.", "Serve with sweet chili sauce and lime."], "Sticky chicken drumsticks": ["Mix 3 tbsp soy, 3 tbsp honey, 2 tbsp ketchup and 2 garlic cloves.", "Toss 8–10 drumsticks in half the sauce.", "Roast at 200°C for 35–40 min, brushing with the rest of the sauce twice.", "Sprinkle with sesame seeds and serve with rice."], "Coconut rice with peanut chicken": ["Cook 3 dl rice with 1 can coconut milk, 2 dl water and a pinch of salt on low for 15 min.", "Fry 500 g sliced chicken for 6 min.", "Add 3 tbsp peanut butter, 2 tbsp soy, lime juice and a splash of water and toss.", "Serve with the rice and cilantro."], "Butter chicken": ["If you have time, marinate 600 g chicken pieces in 2 dl yogurt and 2 tsp garam masala for 30 min or longer.", "Brown the chicken in 2 tbsp butter in a wide pan for 6 min. It does not need to be cooked through yet.", "Add 3 garlic cloves and 1 tbsp ginger for 1 min, then 1 tsp garam masala and 1 tsp cumin.", "Add 1 can chopped tomatoes and simmer for 15 min.", "Stir in 2 dl cream and 1 tbsp butter and simmer for 3 min. Season with salt and a pinch of sugar.", "Serve with rice or naan."], "Chicken tikka masala": ["Mix 600 g chicken pieces with 2 dl yogurt, 2 tsp garam masala, 1 tsp paprika and salt. Marinate for 30 min or more.", "Grill or fry in a very hot pan until charred at the edges, about 8 min.", "Fry 1 chopped onion for 8 min until golden, add 3 garlic cloves, ginger and 2 tsp garam masala for 1 min.", "Add 1 can tomatoes and simmer for 15 min, then blend smooth if you like.", "Add 1.5 dl cream and the chicken and simmer for 5 min. Serve with rice."], "Chicken korma": ["Soften 1 chopped onion with 2 garlic cloves and ginger in oil for 8 min, without browning.", "Add 600 g chicken pieces and 1 tbsp curry powder and cook for 3 min.", "Add 1 can coconut milk and 50 g finely ground nuts.", "Simmer for 20 min until the chicken is cooked and the sauce is creamy. Add a splash of cream if you like.", "Season with salt and a pinch of sugar. Serve with rice."], "Simple chicken curry": ["Fry 1 chopped onion in oil for 10 min until deep golden. This gives the curry its flavour.", "Add 3 garlic cloves, ginger and 2 tbsp curry powder and fry for 1 min.", "Add 600 g chicken pieces and stir to coat.", "Add 1 can tomatoes and 1 dl water, cover and simmer for 25 min.", "Take off the heat, stir in 1 dl yogurt and season. Serve with rice."], "Lamb curry": ["Cut 800 g lamb into cubes. Brown in batches in a hot pot with oil and set aside.", "Fry 2 chopped onions for 10 min until golden, add 4 garlic cloves, ginger and 2 tbsp curry powder.", "Return the lamb with 1 can tomatoes and 3 dl water.", "Cover and simmer on low for 1–1.5 hours until the lamb is tender.", "Stir in yogurt and garam masala at the end. Serve with rice."], "Lamb rogan josh": ["Brown 800 g lamb cubes in batches and set aside.", "Fry 2 chopped onions until golden, add 4 garlic cloves, ginger, 2 tbsp paprika, 2 tsp garam masala and crushed cardamom.", "Stir in 2 tbsp tomato paste for 1 min.", "Add 2 dl yogurt a spoon at a time, stirring, then the lamb and 3 dl water.", "Cover and simmer for 1–1.5 hours until tender. Serve with rice."], "Beef curry": ["Brown 800 g beef cubes in batches.", "Fry 2 onions until golden, add garlic, ginger and 2 tbsp curry powder.", "Return the beef, add 1 can tomatoes and 4 dl water.", "Cover and simmer for 1.5 hours. Add 3 diced potatoes (and coconut milk if using) for the last 30 min.", "Season and serve with rice."], "Keema (spiced mince with peas)": ["Fry 1 chopped onion for 6 min, then add 3 garlic cloves and ginger.", "Add 500 g mince and brown for 6 min, breaking it up.", "Stir in 2 tbsp curry powder for 1 min, then 1 can tomatoes.", "Simmer for 15 min until thick.", "Add 3 dl peas for 3 min and finish with garam masala. Serve with rice or flatbread."], "Chana masala": ["Fry 1 large chopped onion in oil for 10 min until golden.", "Add 3 garlic cloves, ginger, 1 tsp cumin and 2 tsp garam masala and fry for 1 min.", "Add 1 can tomatoes and cook for 5 min until thick.", "Add 2 drained cans of chickpeas and 2 dl water. Simmer for 20 min, mashing a few chickpeas to thicken.", "Finish with lemon juice and salt. Serve with rice."], "Dal tadka": ["Rinse 2.5 dl red lentils and simmer in 7 dl water with ½ tsp turmeric and 1 tsp salt for 20 min until soft.", "Whisk to a smooth, pourable consistency, adding water if needed.", "For the tadka, heat 3 tbsp oil or butter, add 1 tsp cumin seeds or ground cumin and fry for 20 seconds.", "Add 1 sliced onion, 2 garlic cloves and chili and fry until golden (add a chopped tomato if using).", "Pour the hot tadka over the dal and stir. Serve with rice."], "Spinach and chickpea curry": ["Soften 1 onion, 2 garlic cloves and ginger in oil for 6 min.", "Add 2 tbsp curry powder for 30 seconds.", "Add 1 can tomatoes and 2 drained cans of chickpeas (and coconut milk if using).", "Simmer for 15 min.", "Stir in 250 g spinach until wilted. Serve with rice."], "Aloo gobi (potato and cauliflower)": ["Cut 3 potatoes into cubes and 1 cauliflower into florets.", "Fry 1 onion in 3 tbsp oil for 5 min with 1 tsp cumin and 1 tsp turmeric, plus garlic and ginger.", "Add the vegetables and 1 dl water, salt and stir to coat.", "Cover and cook on low for 20 min, stirring now and then, until tender.", "Add chopped tomato and garam masala and cook uncovered for 3 min."], "Cauliflower and chickpea curry": ["Soften 1 onion and 2 garlic cloves with 2 tbsp curry powder.", "Add 1 head cauliflower in florets, 1 drained can of chickpeas and 1 can coconut milk.", "Simmer covered for 15–20 min until the cauliflower is tender.", "Stir in spinach and season. Serve with rice."], "Sweet potato curry": ["Peel and cube 800 g sweet potato.", "Fry 1 onion, 2 garlic cloves and 2 tbsp curry powder in oil for 5 min.", "Add the sweet potato, 1 can coconut milk and 2 dl water.", "Simmer for 20 min until tender (add chickpeas if using).", "Stir in spinach and lime juice. Serve with rice."], "Egg curry": ["Boil 8 eggs for 9 min, cool and peel. Score them lightly so the sauce soaks in.", "Fry 1 onion for 8 min, add garlic, ginger and 2 tbsp curry powder.", "Add 1 can tomatoes (and coconut milk if using) and simmer for 10 min.", "Add the eggs and simmer for 5 min, spooning sauce over them.", "Serve with rice."], "Fish curry with coconut": ["Fry 1 onion and 2 garlic cloves with 1 tbsp curry powder for 5 min.", "Add 1 can coconut milk and a chopped tomato and simmer for 5 min.", "Add 600 g white fish in big chunks.", "Simmer very gently for 5–6 min without stirring too much, until the fish flakes.", "Finish with lime and cilantro. Serve with rice."], "Vegetable korma": ["Soften 1 onion in oil, add 2 tbsp curry powder.", "Add 2 diced potatoes, 2 carrots and cauliflower with 1 can coconut milk and 1 dl water.", "Simmer for 20 min until tender.", "Add 2 dl peas and 3 tbsp ground nuts and cook for 3 min. Serve with rice."], "Mushroom curry": ["Fry 500 g quartered mushrooms in a hot pan until browned.", "Add 1 onion and 2 garlic cloves and cook for 5 min.", "Add 2 tbsp curry powder for 30 seconds, then 1 can tomatoes.", "Simmer for 10 min, add peas and a splash of cream. Serve with rice."], "Chicken biryani": ["Marinate 600 g chicken in 2 dl yogurt, 2 tsp garam masala, garlic and salt for 30 min.", "Fry 2 sliced onions slowly in oil for 15 min until dark golden. Set half aside.", "Boil 4 dl rinsed basmati rice in salted water for 5 min (half-cooked) and drain.", "Brown the chicken with the remaining onions for 8 min.", "Layer the rice over the chicken, top with the reserved onions, raisins and nuts. Cover tightly with foil and a lid.", "Cook on the lowest heat for 25 min. Fluff and serve."], "Vegetable biryani": ["Fry 1 sliced onion until golden, then add 2 tsp garam masala.", "Add 2 carrots, cauliflower and 2 dl peas and fry for 3 min.", "Add 4 dl rinsed basmati rice and 7 dl water with salt.", "Cover and cook on low for 15 min, then rest for 5 min without lifting the lid.", "Fluff up and top with raisins, nuts and yogurt."], "Tandoori chicken": ["Mix 2 dl yogurt, juice of 1 lemon, 3 garlic cloves, 2 tsp paprika, 2 tsp garam masala and salt.", "Score 8 chicken thighs or legs and coat in the marinade. Marinate for at least 1 hour.", "Heat the oven to 220°C.", "Roast on a rack for 30–35 min until charred and cooked through.", "Serve with rice, lemon and salad."], "Saag aloo": ["Boil 600 g cubed potatoes for 8 min and drain.", "Fry 1 onion, 2 garlic cloves, 1 tsp cumin and turmeric in oil for 5 min.", "Add the potatoes and fry for 8 min until golden at the edges.", "Add 300 g spinach and cook until wilted. Season with chili and salt."], "Chickpea and potato curry": ["Fry 1 onion with 2 tbsp curry powder for 5 min.", "Add 3 diced potatoes, 1 can tomatoes and 3 dl water.", "Simmer for 15 min.", "Add 1 drained can of chickpeas (and coconut milk if using) and cook for 10 min.", "Stir in spinach and serve with rice."], "Taco night (Norwegian taco)": ["Brown 400 g mince in a pan for 5–6 min.", "Add 1 bag taco spice and 1.5 dl water and simmer for 5 min until thick.", "Meanwhile chop lettuce, tomato and cucumber, drain a can of corn and grate 150 g cheese.", "Warm 8 tortillas in a dry pan or the oven.", "Put everything on the table with salsa and sour cream and let everyone build their own."], "Chicken tacos": ["Slice 500 g chicken and toss with 1 bag taco spice and 1 tbsp oil.", "Fry for 6–8 min until cooked and slightly charred.", "Warm the tortillas.", "Fill with chicken, lettuce, avocado, salsa and sour cream, and squeeze over lime."], "Fish tacos": ["Season 500 g white fish with 1 tsp paprika, 1 tsp cumin and salt.", "Fry in oil for 3 min per side, then break into chunks.", "Shred ¼ cabbage and toss with lime juice and salt.", "Warm the tortillas and fill with fish, slaw, sour cream and avocado."], "Shrimp tacos": ["Toss 400 g shrimp with 2 garlic cloves, chili flakes and salt.", "Fry in a hot pan for 2–3 min until pink.", "Warm the tortillas.", "Fill with shrimp, shredded cabbage, avocado and sour cream. Add lime."], "Bean tacos": ["Fry 2 drained cans of beans with 1 bag taco spice and 1 dl water for 5 min.", "Mash about half with a fork.", "Warm the tortillas and fill with beans, cheese, avocado, salsa and sour cream."], "Burritos": ["Cook 3 dl rice and season it with salt and lime.", "Warm seasoned beans, or cook mince or chicken with taco spice.", "Lay out 4 large tortillas. Put rice, filling and cheese in the centre with salsa and sour cream.", "Fold in the sides and roll up tightly.", "Toast seam-side down in a dry pan for 2 min per side."], "Burrito bowl": ["Cook 3 dl rice and season with lime and salt.", "Warm 1 can beans and 1 can corn. Cook chicken with taco spice if using.", "Fill bowls with rice, beans, corn and chicken.", "Top with salsa, avocado, sour cream and cheese."], "Chicken fajitas": ["Slice 500 g chicken, 2 bell peppers and 1 onion into strips.", "Toss with 2 tsp paprika, 1 tsp cumin, salt and 2 tbsp oil.", "Fry in a very hot pan for 8–10 min until the chicken is cooked and the vegetables are charred.", "Squeeze over lime. Serve in warm tortillas with sour cream and cheese."], "Beef fajitas": ["Slice 500 g beef thin and toss with paprika, cumin and salt.", "Sear in a very hot pan for 2 min, then remove.", "Fry peppers and onion in strips for 5 min.", "Return the beef and add lime. Serve in tortillas with avocado and sour cream."], "Chicken quesadillas": ["Sprinkle grated cheese over half a tortilla, add cooked chicken (and peppers), then more cheese.", "Fold over or cover with a second tortilla.", "Fry in a dry pan on medium for 2–3 min per side until crisp and melted.", "Cut into wedges. Serve with salsa and sour cream."], "Bean and cheese quesadillas": ["Mash 1 can beans with a pinch of cumin and salt.", "Spread on tortillas, add corn and cheese and fold.", "Fry for 2–3 min per side until crisp. Serve with salsa."], "Chicken enchiladas": ["Heat the oven to 200°C.", "Simmer 1 can tomatoes with 1 bag taco spice for 5 min.", "Mix 400 g cooked chicken with a third of the sauce (and beans).", "Fill and roll 8 tortillas and place them seam-down in a dish.", "Pour over the rest of the sauce, top with 150 g cheese and bake for 20 min."], "Bean enchiladas": ["Heat the oven to 200°C.", "Mix 2 cans beans and 1 can corn with taco spice.", "Fill and roll tortillas, and place in a dish.", "Cover with tomato sauce and cheese and bake for 20 min. Serve with sour cream."], "Chili sin carne": ["Fry 1 onion, 2 garlic cloves and 1 pepper in oil for 6 min.", "Add 2 tsp cumin, 2 tsp paprika and chili flakes for 1 min.", "Add 2 cans tomatoes, 2 drained cans of beans, 1 dl red lentils and 3 dl water.", "Simmer for 25–30 min until thick. Add corn for the last 5 min.", "Serve with rice and sour cream."], "White chicken chili": ["Soften 1 onion and 2 garlic cloves in oil with 2 tsp cumin.", "Add 7 dl stock, 2 drained cans white beans and 500 g chicken breast.", "Simmer for 20 min, then lift out the chicken and shred it.", "Return it with corn and chopped chili, and stir in 100 g cream cheese until melted.", "Finish with lime juice."], "Sweet potato and bean chili": ["Fry 1 onion with 2 tsp cumin and 2 tsp paprika.", "Add 600 g cubed sweet potato, 2 cans tomatoes, 1 can beans and 2 dl water.", "Simmer for 30 min until the sweet potato is soft.", "Add corn and lime. Serve with sour cream."], "Mexican rice": ["Heat 2 tbsp oil and fry 3 dl rice for 3 min until lightly toasted.", "Add 1 chopped onion and 2 garlic cloves for 2 min, then 2 tbsp tomato paste and 1 tsp cumin.", "Add 6 dl stock, bring to the boil, cover and cook on low for 18 min.", "Rest for 5 min, then stir in peas or corn."], "Chicken taco bowl": ["Cook the rice.", "Fry 500 g chicken with taco spice.", "Warm beans and corn.", "Assemble with avocado, salsa and sour cream."], "Stuffed peppers Mexican-style": ["Heat the oven to 200°C. Halve and seed 4 bell peppers.", "Brown 400 g mince with taco spice, then mix with 3 dl cooked rice, ½ can tomatoes and beans or corn.", "Fill the peppers and put them in a dish.", "Top with cheese and bake for 25 min until the peppers are soft."], "Taco lasagne": ["Heat the oven to 200°C.", "Brown 400 g mince with taco spice and 1 can tomatoes for 10 min.", "In a dish, layer tortillas, meat sauce, beans or corn and cheese. Repeat 3 times.", "Finish with cheese and bake for 25 min. Serve with sour cream."], "Tortilla pizza": ["Heat the oven to 220°C.", "Spread 1 tbsp tomato paste thinned with water on a tortilla. Add ham, mushrooms and oregano.", "Top with cheese.", "Bake on a tray for 8–10 min until crisp at the edges."], "Chicken and chorizo jambalaya": ["Brown 400 g chicken pieces and 150 g sliced chorizo in a pot for 6 min.", "Add 1 onion, 1 pepper and 1 celery stalk and cook for 5 min, then garlic and 2 tsp paprika.", "Add 3 dl rice, 1 can tomatoes and 6 dl stock.", "Cover and simmer on low for 20 min until the rice is cooked.", "Add shrimp for the last 5 min if using."], "Meatballs in brown sauce (kjøttkaker)": ["Mix 500 g mince with 1 tsp salt and stir for 1 min until sticky.", "Add 1 egg, 1 grated onion, 3 tbsp breadcrumbs, ½ tsp nutmeg and 1 dl water and mix.", "Shape 12 flat round patties with wet hands. Brown in butter for 2–3 min per side.", "For the sauce, melt 2 tbsp butter, stir in 2 tbsp flour and cook until nut-brown. Whisk in 5 dl stock.", "Add the patties to the sauce and simmer for 15 min.", "Serve with boiled potatoes, mashed peas and lingonberry jam."], "Karbonader with onions": ["Season 500 g mince with salt and pepper (and mix in 1 egg and 2 tbsp breadcrumbs if using).", "Shape 8 flat patties.", "Fry in butter on medium-high for 3–4 min per side. Keep warm.", "Fry 2 sliced onions in the same pan for 8 min until golden.", "Add 2 dl stock and let it bubble for 2 min. Serve with potatoes."], "Fårikål (lamb and cabbage)": ["Cut 1 head of cabbage into wedges and use 1.5 kg lamb pieces on the bone.", "In a large pot, layer lamb (fattiest pieces at the bottom) and cabbage.", "Sprinkle 1 tbsp salt and 1 tbsp whole black peppercorns between the layers.", "Add 3 dl water and bring to the boil.", "Simmer covered on low for 2–2.5 hours until the meat falls off the bone.", "Serve with boiled potatoes."], "Brown lapskaus (stew)": ["Cut 600 g beef into small cubes and brown in batches with 1 onion.", "Add 1 litre stock, 1 bay leaf and thyme and simmer for 45 min.", "Add 800 g diced potatoes, 2 carrots and ½ swede in cubes.", "Simmer for 30–40 min until the potatoes start to fall apart and thicken the stew.", "Season well. Serve with flatbread and pickled beetroot."], "Fiskegrateng (fish au gratin)": ["Heat the oven to 200°C. Cook 2 dl macaroni.", "Melt 50 g butter, stir in 6 tbsp flour and whisk in 6 dl milk. Simmer until thick.", "Cool slightly, then stir in 2 egg yolks, nutmeg and salt. Whisk the 2 whites stiff and fold in.", "Fold in the macaroni and 500 g raw or cooked fish in pieces.", "Pour into a dish, top with cheese and breadcrumbs and bake for 30–40 min until risen and golden."], "Homemade fish cakes (fiskekaker)": ["Cut 500 g cod in pieces and blend with 1½ tsp salt until sticky.", "Add 1 egg, 2 tbsp cornstarch and nutmeg and blend.", "Add 2 dl cold milk a little at a time and blend to a soft mix. Stir in 1 grated onion.", "Shape flat cakes with a wet spoon and fry in butter on medium for 3–4 min per side.", "Serve with potatoes, grated carrot and brown sauce or remoulade."], "Plukkfisk": ["Boil 600 g potatoes and dice them.", "Poach 500 g salted or fresh cod in milk for 6–8 min, then flake.", "Melt 2 tbsp butter with 2 dl of the milk (and a little sliced leek).", "Stir in the fish and potatoes and mash roughly. Season with lots of pepper.", "Top with crispy bacon."], "Baked salmon with potatoes and cucumber salad": ["Boil 800 g potatoes.", "Slice 1 cucumber thin. Mix with 2 tbsp vinegar, 1 tbsp sugar, 3 tbsp water and salt. Rest for 15 min.", "Heat the oven to 200°C. Season 4 salmon fillets and bake for 12–15 min until just opaque.", "Serve with potatoes, cucumber salad, sour cream with dill and lemon."], "Cod with bacon and butter": ["Boil 800 g potatoes (and carrots).", "Season 600 g cod and poach in barely simmering salted water for 6–8 min.", "Fry 150 g bacon in strips until crisp, then add 50 g butter and melt.", "Serve the cod with potatoes and pour the bacon butter over."], "Cod with Sandefjord butter": ["Boil 800 g potatoes.", "Poach 600 g cod gently for 6–8 min.", "Boil 2 dl cream in a small pan until reduced by half.", "Off the heat, whisk in 150 g cold butter in cubes, a bit at a time, until creamy. Add lemon juice and salt.", "Serve the fish with potatoes, the sauce and parsley."], "Pølse i lompe (hot dogs)": ["Heat sausages in hot but not boiling water for 5 min, or fry or grill them.", "Warm lompe, buns or tortillas.", "Wrap and add ketchup, mustard and crispy or raw onion."], "Pyttipanne": ["Dice 800 g boiled potatoes (or raw, then cook longer).", "Fry in oil and butter for 15 min, turning now and then, until golden.", "Add 1 chopped onion and 300 g diced sausage or ham and fry for 5 min.", "Serve with a fried egg on top and pickled beetroot."], "Creamy chicken stew (kyllinggryte)": ["Start the rice. Cut 600 g chicken into pieces.", "Brown with 1 onion and 1 pepper for 6 min.", "Stir in 2 tsp paprika and 2 tbsp tomato paste.", "Add 3 dl cream and 1 dl water and simmer for 15 min.", "Season and serve with rice."], "Sausage stroganoff (pølsestroganoff)": ["Start the rice. Slice 400 g sausages and chop 1 onion.", "Fry both in butter for 6 min.", "Stir in 2 tsp paprika and 3 tbsp tomato paste for 1 min.", "Add 3 dl cream (and 1 tbsp ketchup) and simmer for 5 min.", "Serve with rice."], "Beef stroganoff": ["Slice 500 g beef into thin strips and season.", "Sear in batches in a very hot pan for 1–2 min, then remove.", "Fry 1 onion and 250 g mushrooms in butter for 6 min.", "Stir in 1 tbsp mustard, 1 tsp paprika and 3 dl sour cream and warm gently. Do not boil.", "Return the beef. Serve with rice or pasta."], "Sausage stew (pølsegryte)": ["Slice 400 g sausages and fry with 1 onion for 5 min.", "Add 1 pepper, 1 tsp paprika, 1 can tomatoes, 4 diced potatoes and 3 dl water.", "Simmer for 20 min until the potatoes are soft.", "Season and serve with bread."], "Swedish meatballs": ["Mix 500 g mince with 1 grated onion, 1 egg, 3 tbsp breadcrumbs, 1 dl cream, salt and nutmeg.", "Roll into small balls with wet hands.", "Fry in butter for 8–10 min, shaking the pan, until browned all over.", "Add 3 dl stock and 1 dl cream to the pan and simmer for 5 min.", "Serve with mashed potatoes and lingonberry jam."], "Meatloaf (kjøttpudding)": ["Heat the oven to 180°C.", "Mix 700 g mince, 1 chopped onion, 1 egg, 1 dl breadcrumbs, 1 dl milk, salt and 1 tbsp worcestershire.", "Shape a loaf on a lined tray (wrap in bacon if using).", "Brush with ketchup and bake for 50–60 min.", "Rest for 10 min and slice. Serve with potatoes."], "Cabbage rolls": ["Heat the oven to 180°C. Blanch 12 cabbage leaves in boiling water for 2 min and cut out the hard centre vein.", "Mix 500 g mince with 2 dl cooked rice, 1 onion and salt.", "Put a spoonful on each leaf and roll up tightly.", "Place in a dish and pour over 1 can tomatoes mixed with 2 dl water (or cream).", "Cover and bake for 40–45 min."], "Mushroom risotto": ["Fry 300 g sliced mushrooms in butter until browned and set aside. Heat 1.2 litres stock in a pot.", "Soften 1 onion in butter for 5 min, add garlic and 3 dl risotto rice. Stir for 2 min until the rice is glossy.", "Add a ladle of hot stock and stir until absorbed. Repeat for 18–20 min until the rice is creamy but firm in the middle.", "Stir in the mushrooms, 2 tbsp butter and 50 g parmesan. Rest for 2 min."], "Pea and bacon risotto": ["Fry 150 g bacon until crisp. Heat 1.2 litres stock.", "Soften 1 onion in the bacon fat, add 3 dl rice and stir for 2 min.", "Add stock a ladle at a time, stirring, for 18 min.", "Stir in 3 dl peas for the last 3 min.", "Finish with butter, parmesan, the bacon and lemon zest."], "Lemon risotto": ["Heat 1.2 litres stock. Soften 1 onion in butter.", "Add 3 dl rice and stir for 2 min.", "Add stock gradually for 18–20 min.", "Finish with the zest and juice of 1 lemon, 2 tbsp butter and 50 g parmesan. Add peas and parsley if you like."], "Chicken risotto": ["Brown 400 g diced chicken and set aside.", "Make a risotto with onion, 3 dl rice and 1.2 litres stock (about 20 min).", "Add mushrooms or spinach and the chicken for the last 5 min.", "Finish with butter and parmesan."], "Shrimp risotto": ["Make a risotto with onion, garlic, 3 dl rice and 1.2 litres stock.", "After 15 min, add 300 g shrimp and peas.", "Cook for 4 more min.", "Finish with lemon zest and juice and a little parmesan."], "Sweet potato risotto": ["Simmer 400 g diced sweet potato in a little stock for 10 min until soft.", "Make a risotto with onion, thyme, 3 dl rice and hot stock.", "Halfway through, mash half the sweet potato and stir it in.", "Add the rest of the cubes at the end with butter and parmesan."], "Easy paella": ["Brown 400 g chicken pieces and 100 g sliced chorizo in a wide pan.", "Add 1 onion and 1 pepper and cook for 5 min, then 2 tsp paprika and a pinch of turmeric.", "Stir in 3 dl rice to coat in the oil.", "Add 8 dl hot stock, spread the rice evenly and simmer uncovered for 18–20 min. Do not stir.", "Press in shrimp and peas for the last 5 min. Rest for 5 min and serve with lemon."], "Spanish chicken and potatoes": ["Heat the oven to 200°C.", "Toss 8 chicken thighs and 800 g potato chunks with 2 tsp smoked paprika, 3 garlic cloves, salt and 3 tbsp oil.", "Add chorizo, onion wedges and olives if using.", "Roast for 40–45 min, turning once, until golden and cooked. Squeeze over lemon."], "Spanish tortilla": ["Slice 600 g potatoes and 1 onion thin.", "Cook them slowly in 2 dl oil in a pan on medium-low for 15–20 min until soft but not brown. Drain, keeping the oil.", "Beat 6 eggs with salt and mix in the potatoes. Rest for 10 min.", "Heat 2 tbsp of the oil in a non-stick pan and pour in the mix. Cook on low for 8 min until the edges set.", "Flip onto a plate, slide back into the pan and cook for 3–4 min. Serve warm or cold."], "Ratatouille": ["Cut 1 eggplant, 2 zucchini and 2 peppers into cubes.", "Fry each vegetable separately in olive oil until golden and set aside.", "Soften 1 onion and 3 garlic cloves, add 1 can tomatoes and thyme.", "Add the vegetables back and simmer on low for 30 min.", "Finish with basil and olive oil."], "Chicken piccata": ["Halve 2 chicken breasts horizontally and flatten them. Season and dust in flour.", "Fry in oil and butter for 3 min per side until golden. Remove.", "Add 1 dl water or stock, the juice of 1 lemon and 2 tbsp capers to the pan and let it bubble for 2 min.", "Swirl in 2 tbsp cold butter and return the chicken. Serve with pasta and parsley."], "Chicken parmigiana": ["Heat the oven to 200°C. Halve and flatten 2 chicken breasts.", "Coat in flour, egg and breadcrumbs mixed with parmesan.", "Fry for 3 min per side until golden.", "Put in a dish, spoon over tomato sauce (simmered tomatoes with garlic) and top with mozzarella.", "Bake for 15 min. Serve with pasta and basil."], "Eggplant parmigiana": ["Slice 2 eggplants 1 cm thick, brush with oil and roast at 220°C for 20 min until soft."
