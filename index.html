, "Simmer 2 cans tomatoes with garlic for 15 min.", "Layer eggplant, sauce, mozzarella and parmesan in a dish. Repeat.", "Bake at 190°C for 30 min. Rest for 10 min and serve with basil."], "Chicken schnitzel": ["Flatten 2 chicken breasts to 1 cm and season.", "Coat in flour, beaten egg and breadcrumbs.", "Fry in 1 cm hot oil for 3–4 min per side until golden and cooked through.", "Drain on paper. Serve with lemon wedges and potatoes."], "Pork schnitzel": ["Pound 4 pork slices thin and season.", "Coat in flour, egg and breadcrumbs.", "Fry in oil and butter for 2–3 min per side.", "Serve with lemon, capers and potatoes."], "Beef stew": ["Cut 1 kg beef into cubes, toss in 2 tbsp flour and salt.", "Brown in batches in a hot pot with oil.", "Add 2 onions, 3 garlic cloves and 2 tbsp tomato paste and cook for 3 min.", "Add 8 dl stock, thyme and bay. Cover and simmer for 1.5 hours.", "Add 4 potatoes and 3 carrots in chunks and simmer for 45 min more until tender."], "Beef goulash": ["Brown 1 kg beef cubes in batches.", "Fry 3 sliced onions in the pot for 10 min until soft and golden.", "Stir in 3 tbsp paprika and 2 tbsp tomato paste for 1 min.", "Add 8 dl stock and the beef. Simmer covered for 1.5–2 hours.", "Add peppers and potatoes for the last 30 min if using."], "Shepherd's pie": ["Brown 500 g lamb mince, add 1 onion and 2 carrots and cook for 5 min.", "Add 2 tbsp tomato paste, 2 dl stock and worcestershire and simmer for 20 min. Stir in peas.", "Boil 1 kg potatoes and mash with butter and milk.", "Heat the oven to 200°C. Put the mince in a dish and spread the mash on top. Rough it up with a fork.", "Bake for 25 min until golden."], "Cottage pie": ["Brown 500 g beef mince with 1 onion and 2 carrots.", "Add 2 tbsp tomato paste, 2 dl stock and worcestershire and simmer for 20 min.", "Make mash from 1 kg potatoes.", "Top the mince with the mash and cheese and bake at 200°C for 25 min."], "Fish pie": ["Poach 600 g fish in 5 dl milk for 5 min. Lift out the fish and keep the milk.", "Make a white sauce with 40 g butter, 3 tbsp flour and the milk.", "Add the fish in chunks, shrimp, peas and chopped boiled eggs to a dish and pour over the sauce.", "Top with mash from 1 kg potatoes (and cheese).", "Bake at 200°C for 30 min until golden."], "Toad in the hole": ["Heat the oven to 220°C. Put 8 sausages in a dish with 3 tbsp oil and roast for 10 min.", "Whisk 140 g flour, 3 eggs, 2 dl milk and a pinch of salt until smooth.", "Pour the batter over the sausages quickly while the dish is very hot.", "Bake for 25 min without opening the oven door, until puffed and golden.", "Serve with onion gravy."], "Bangers and mash with onion gravy": ["Fry 8 sausages slowly on medium-low for 15 min, turning.", "Boil 1 kg potatoes and mash with butter, milk and mustard.", "Fry 2 sliced onions for 15 min until dark, stir in 1 tbsp flour and add 4 dl stock. Simmer until thick.", "Serve sausages on the mash with the gravy."], "Chicken pot pie": ["Make a sauce: 40 g butter, 3 tbsp flour, 4 dl stock and 1 dl milk.", "Add 400 g cooked chicken, 1 onion and 2 carrots (softened) and 2 dl peas, with thyme.", "Pour into a dish.", "Cover with puff pastry, cut a slit and brush with egg or milk.", "Bake at 200°C for 30 min until puffed and golden."], "Quiche Lorraine": ["Rub 200 g flour with 100 g cold butter, add 3 tbsp cold water and press into a dough. Chill for 20 min.", "Roll out to line a tin. Prick and bake blind at 200°C for 12 min.", "Fry 150 g bacon (and an onion) and scatter in the case with 100 g cheese.", "Whisk 3 eggs with 3 dl cream, salt and pepper and pour over.", "Bake at 180°C for 30–35 min until just set."], "Spinach and feta pie": ["Thaw and squeeze 450 g spinach. Mix with 200 g feta, 2 eggs, dill and a softened onion.", "Line a dish with puff pastry and spread in the filling.", "Cover with more pastry and brush with egg.", "Bake at 200°C for 30 min until golden."], "Stuffed zucchini": ["Heat the oven to 200°C. Halve 4 zucchini lengthways and scoop out the middle. Chop the flesh.", "Brown 400 g mince with onion and the chopped zucchini, then add ½ can tomatoes.", "Fill the zucchini and top with cheese.", "Bake for 25 min."], "Moussaka": ["Slice 2 eggplants, brush with oil and roast at 220°C for 20 min.", "Brown 500 g lamb mince with 1 onion, add 1 can tomatoes and 1 tsp cinnamon and simmer for 20 min.", "Make a thick white sauce with 50 g butter, 50 g flour and 6 dl milk. Stir in 1 egg and cheese.", "Layer eggplant and meat sauce in a dish and spread the white sauce on top.", "Bake at 180°C for 40 min. Rest for 15 min before cutting."], "Chicken souvlaki with tzatziki": ["Cut 600 g chicken into cubes. Marinate in juice of 1 lemon, 3 tbsp oil, 2 garlic cloves, 2 tsp oregano and salt for 30 min.", "Thread onto skewers and grill or fry for 10 min, turning.", "For the tzatziki, grate ½ cucumber, squeeze dry and mix with 3 dl yogurt, garlic and salt.", "Serve in warm pita with tomato and red onion."], "Gyros-style pork pita": ["Slice 500 g pork thin and toss with paprika, oregano, garlic and salt.", "Fry in a very hot pan for 5–6 min until crisp at the edges.", "Make tzatziki.", "Fill warm pitas with pork, tzatziki, tomato and red onion."], "Chicken shawarma": ["Toss 600 g chicken thighs with 1 tsp each cumin, coriander and paprika, 3 garlic cloves, lemon juice and oil.", "Roast at 220°C for 25 min or fry until charred. Slice thin.", "Mix yogurt with garlic (or tahini) for the sauce.", "Serve in pita with cucumber, tomato and sauce."], "Falafel": ["Drain 2 cans chickpeas well and pat dry.", "Blend with 1 onion, 3 garlic cloves, herbs, 2 tsp cumin, 1 tsp salt and 3 tbsp flour to a coarse paste. Do not blend it smooth.", "Chill for 30 min, then roll into walnut-sized balls.", "Fry in 2 cm oil for 3–4 min until deep golden. Or bake at 220°C for 20 min, turning once.", "Serve in pita with tahini sauce and salad."], "Green shakshuka": ["Soften 1 diced zucchini and 2 garlic cloves in olive oil for 5 min.", "Add 300 g spinach (and cumin) and cook until wilted.", "Make wells and crack in 4–6 eggs.", "Cover and cook on low for 6–8 min until set.", "Top with feta and serve with bread."], "Halloumi tray bake": ["Heat the oven to 220°C.", "Toss 600 g baby potatoes (halved), 1 zucchini, 1 red onion and 1 pepper with oil, oregano and salt.", "Roast for 25 min.", "Add 250 g halloumi in slices and roast for 10–12 min more until golden.", "Squeeze over lemon."], "Moroccan chickpea stew": ["Fry 1 onion in oil with 2 tsp cumin and 1 tsp cinnamon.", "Add 2 carrots, 1 can tomatoes, 2 cans chickpeas and 3 dl water (plus raisins).", "Simmer for 25 min.", "Serve over couscous (3 dl couscous soaked in 3 dl boiling water for 5 min) with lemon."], "Chicken tagine with lemon and olives": ["Brown 8 chicken thighs.", "Fry 1 onion and 3 garlic cloves with 1 tsp cumin, ginger and turmeric.", "Return the chicken with 3 dl water, 1 sliced lemon and a handful of olives.", "Cover and simmer for 40 min.", "Serve with couscous."], "Lamb kofta": ["Mix 500 g lamb mince with 1 grated onion, 2 garlic cloves, 1 tsp cumin, 1 tsp coriander, parsley and salt.", "Shape into 12 sausages around skewers.", "Grill or fry for 8–10 min, turning.", "Serve with pita, yogurt and salad."], "Homemade pizza margherita": ["Mix 400 g flour, 1 tsp dry yeast and 1 tsp salt. Add 2.5 dl warm water and 2 tbsp oil.", "Knead for 8 min until smooth and leave to rise for 1 hour.", "Heat the oven as hot as it goes (250–275°C) with a tray inside.", "Split the dough in two and stretch thin. Spread with crushed tomatoes and salt and add torn mozzarella.", "Bake on the hot tray for 8–12 min. Finish with basil and olive oil."], "Ham and pineapple pizza": ["Make the pizza dough and let it rise for 1 hour.", "Heat the oven to its maximum temperature.", "Stretch the dough and spread with tomato sauce. Add cheese, ham, drained pineapple and oregano.", "Bake for 10–12 min."], "Pepperoni-style chorizo pizza": ["Make the pizza dough and let it rise.", "Stretch it and spread with tomato sauce.", "Add mozzarella and thinly sliced chorizo.", "Bake very hot for 10 min. Add chili flakes."], "Calzone": ["Make the pizza dough and divide into 2.", "Roll each into a round. Fill one half with tomato sauce, ham, mushrooms and mozzarella.", "Fold over and crimp the edges firmly. Cut a small slit.", "Bake at 230°C for 15–18 min until golden."], "Flatbread pizza with pesto": ["Heat the oven to 220°C.", "Spread 2 tbsp pesto over each flatbread.", "Top with mozzarella and sliced tomato or spinach.", "Bake for 8 min."], "Classic beef burgers": ["Divide 600 g mince into 4 and shape loosely into patties a bit wider than the buns. Press a dimple in the middle.", "Season well with salt and pepper just before cooking.", "Fry in a very hot pan for 3 min per side. Add cheese for the last minute and cover so it melts.", "Toast the buns.", "Build with lettuce, tomato, onion, ketchup and mayo."], "Chicken burger": ["Flatten 2 chicken breasts and cut in half.", "Coat in flour, egg and breadcrumbs.", "Fry for 4 min per side until golden and cooked.", "Serve in toasted buns with lettuce, tomato and mayo."], "Halloumi burger": ["Slice 250 g halloumi thick.", "Fry in a dry pan for 2 min per side until golden.", "Toast the buns.", "Build with lettuce, tomato, avocado and sweet chili sauce."], "Bean burger": ["Mash 2 drained cans of beans roughly.", "Mix with 1 grated onion, 1 tsp cumin, 1 egg, 1 dl breadcrumbs and salt.", "Shape 4 patties and chill for 15 min.", "Fry in oil for 4 min per side until crisp. Serve in buns with cheese and avocado."], "Salmon burger": ["Finely chop 500 g salmon by hand.", "Mix with 1 dl breadcrumbs, 1 egg, lemon zest, dill and salt.", "Shape 4 patties and chill for 15 min.", "Fry for 3 min per side. Serve in buns with lemon mayo and lettuce."], "Sheet-pan chicken and vegetables": ["Heat the oven to 210°C.", "Cut 800 g potatoes, 3 carrots and 1 onion into chunks.", "Toss with 8 chicken thighs, 3 tbsp oil, garlic, paprika, rosemary and salt.", "Spread on a tray in one layer and roast for 35–40 min until golden.", "Squeeze over lemon."], "Sheet-pan sausages and potatoes": ["Heat the oven to 210°C.", "Toss 800 g potato chunks and 1 onion with oil, rosemary and salt and roast for 20 min.", "Add 8 sausages and a sliced pepper.", "Roast for 20 min more. Serve with mustard."], "Sheet-pan salmon with green beans": ["Heat the oven to 220°C.", "Toss 400 g green beans with oil and salt on a tray and roast for 5 min.", "Add 4 salmon fillets with lemon slices and garlic.", "Roast for 12 min more until the salmon is just cooked."], "Loaded baked potatoes": ["Heat the oven to 200°C. Prick 4 large potatoes, rub with oil and salt.", "Bake for 60 min until soft inside.", "Cut a cross in the top and squeeze open.", "Fill with butter, cheese, sour cream, bacon and spring onion."], "Baked potatoes with tuna": ["Bake 4 large potatoes at 200°C for 60 min.", "Mix 2 cans tuna with 4 tbsp mayo, corn and red onion.", "Split the potatoes and fill. Top with cheese if you like."], "Chicken and rice one-pot": ["Season 8 chicken thighs and brown in a pot for 4 min per side. Remove.", "Soften 1 onion and 2 garlic cloves in the fat, add 1 tsp paprika.", "Stir in 3 dl rice and add 6 dl stock.", "Put the chicken on top, cover and cook on low for 20 min.", "Rest for 5 min, add peas and lemon."], "Garlic butter steak with potatoes": ["Roast 800 g potato cubes at 220°C for 30 min.", "Take 4 steaks out of the fridge 30 min before cooking. Pat dry and salt well.", "Sear in a very hot pan for 2–3 min per side for medium-rare.", "Add 50 g butter, 3 crushed garlic cloves and thyme, and spoon the butter over for 1 min.", "Rest for 5 min before slicing."], "Pork chops with apples": ["Season 4 pork chops and sear for 3–4 min per side. Set aside.", "Fry 2 apples and 1 onion, both sliced, in butter for 5 min.", "Add thyme and 1 dl cream or water (with mustard).", "Return the chops and simmer for 3 min until cooked through."], "Pork tenderloin with mustard cream": ["Heat the oven to 180°C. Season 600 g pork tenderloin and sear on all sides.", "Roast for 15–18 min until 63°C inside. Rest for 5 min.", "In the pan, fry mushrooms, then add 2 tbsp mustard and 2.5 dl cream and simmer for 3 min.", "Slice the pork and serve with the sauce and potatoes."], "Honey mustard chicken": ["Heat the oven to 200°C.", "Mix 3 tbsp honey, 3 tbsp mustard, 1 garlic clove and salt.", "Coat 8 chicken thighs and place in a dish with potatoes if using.", "Roast for 30–35 min, basting once."], "Lamb chops with rosemary": ["Rub 8 lamb chops with oil, garlic, chopped rosemary and salt.", "Fry in a very hot pan for 3 min per side for pink.", "Rest for 3 min. Serve with potatoes and lemon."], "Lemon herb chicken thighs": ["Mix the zest and juice of 1 lemon, 3 garlic cloves, thyme, 3 tbsp oil and salt.", "Marinate 8 chicken thighs for at least 20 min.", "Roast at 210°C for 35 min (with potatoes on the same tray if you like)."], "Creamy Tuscan-style chicken": ["Halve 2 chicken breasts and season.", "Fry for 4 min per side until golden, then remove.", "Fry 3 garlic cloves and 200 g cherry tomatoes for 3 min.", "Add 2.5 dl cream and 40 g parmesan and simmer for 2 min, then add 2 handfuls of spinach.", "Return the chicken and simmer for 3 min. Serve with pasta and basil."], "Chicken with mushroom cream sauce": ["Brown 8 chicken thighs for 4 min per side.", "Fry 250 g mushrooms and 1 onion for 5 min.", "Add 3 dl cream and thyme and bring to a simmer.", "Return the chicken and simmer for 15 min. Serve with rice."], "Baked cod with tomatoes and olives": ["Heat the oven to 200°C.", "Put 4 cod fillets in a dish with 250 g halved tomatoes, a handful of olives and 2 sliced garlic cloves (and capers).", "Drizzle with olive oil, salt and lemon.", "Bake for 15 min until the fish flakes. Add basil."], "Oven fish and chips": ["Heat the oven to 220°C. Cut 1 kg potatoes into wedges, toss with oil and salt and roast for 35 min.", "Coat 4 fish fillets in flour, egg and breadcrumbs.", "Put on an oiled tray and bake for the last 15 min, turning once.", "Serve with lemon, mayo and peas."], "Homemade fish fingers": ["Cut 500 g fish into fingers.", "Coat in flour, beaten egg and breadcrumbs.", "Fry in oil for 2 min per side until golden.", "Serve with lemon and mayo."], "Shrimp scampi": ["Cook 400 g pasta.", "Fry 4 sliced garlic cloves in 50 g butter for 1 min.", "Add 400 g shrimp and chili flakes and cook for 2–3 min.", "Add the juice of 1 lemon and toss with the pasta and parsley."], "Gambas al ajillo (garlic shrimp)": ["Slice 6 garlic cloves.", "Warm 1 dl olive oil with the garlic and chili flakes in a small pan on low for 3 min.", "Add 400 g shrimp and cook for 2–3 min until pink.", "Add salt and parsley. Serve sizzling with bread for dipping."], "Chicken and white bean casserole": ["Brown 8 chicken thighs (and sausage) in a pot.", "Add 1 onion and 3 garlic cloves and cook for 5 min.", "Add 1 can tomatoes, 2 cans white beans, 2 dl water and rosemary.", "Simmer covered for 30 min."], "Sloppy joes": ["Brown 500 g mince with 1 onion and 1 pepper for 8 min.", "Add 4 tbsp ketchup, 1 tbsp mustard, 1 tbsp worcestershire and 1 dl water.", "Simmer for 10 min until thick.", "Spoon into toasted buns."], "Meatball subs": ["Mix 500 g mince with 1 egg, 3 tbsp breadcrumbs, garlic, oregano and salt. Roll 20 small balls.", "Brown in oil for 8 min.", "Add 1 can tomatoes and simmer for 10 min.", "Fill rolls with meatballs and sauce, top with mozzarella and grill for 3 min."], "Chicken fricassee": ["Simmer 600 g chicken, 1 onion and 2 carrots in 7 dl stock for 20 min. Lift out and keep the stock.", "Melt 40 g butter, add 3 tbsp flour and whisk in 5 dl of the stock and 1 dl cream.", "Simmer for 5 min, then return the chicken, vegetables and peas.", "Add lemon juice. Serve with rice."], "Honey glazed salmon": ["Mix 2 tbsp honey, 2 tbsp soy and 1 garlic clove.", "Fry 4 salmon fillets for 4 min skin-side down, flip.", "Add the glaze and spoon over for 1–2 min.", "Serve with rice and lemon."], "Cod in curry cream": ["Soften 1 onion (and leek) with 2 tsp curry powder in butter.", "Add 3 dl cream and simmer for 3 min.", "Add 600 g cod in pieces and poach gently for 6 min.", "Serve with rice."], "Lamb stew with root vegetables": ["Brown 1 kg lamb cubes in batches, then add 2 onions.", "Add 8 dl stock, thyme and bay. Simmer covered for 1 hour.", "Add potatoes, carrots and swede in chunks.", "Simmer for 40 min more until tender. Season well."], "Pork and bean cassoulet-style stew": ["Brown 6 sausages and 100 g bacon in a pot.", "Add 1 onion and 3 garlic cloves and cook for 5 min.", "Add 1 can tomatoes, 2 cans white beans, thyme and 2 dl water. Simmer for 30 min.", "Sprinkle breadcrumbs on top and grill or bake until golden."], "Chili cheese baked potatoes": ["Bake 4 potatoes at 200°C for 60 min.", "Make a quick chili: brown 400 g mince, add cumin, 1 can tomatoes and 1 can beans and simmer for 20 min.", "Split the potatoes, spoon in the chili and top with cheese and sour cream."], "Mexican stuffed sweet potatoes": ["Bake 4 sweet potatoes at 200°C for 45–50 min until soft.", "Warm 1 can beans and 1 can corn with cumin.", "Split the potatoes and fill.", "Top with cheese, salsa, sour cream and avocado."], "Tomato soup": ["Chop 1 onion and 2 garlic cloves.", "Soften them in 2 tbsp butter for 8 min on medium-low.", "Add 2 cans tomatoes, 5 dl stock and a pinch of sugar. Simmer for 15 min.", "Blend until smooth. Stir in 1 dl cream and season.", "Serve with basil and grilled cheese or bread."], "Cream of mushroom soup": ["Slice 500 g mushrooms and chop 1 onion.", "Fry in butter on medium-high for 8 min until browned. Add garlic and thyme.", "Add 7 dl stock and simmer for 10 min.", "Blend half, then stir in 2 dl cream. Season well."], "Potato and leek soup": ["Slice 2 leeks and wash them well. Peel and cube 600 g potatoes.", "Soften the leeks in 2 tbsp butter for 8 min without browning.", "Add the potatoes and 1 litre stock. Simmer for 20 min until soft.", "Blend smooth and add cream if you like. Season with salt, pepper and thyme."], "Broccoli cheese soup": ["Soften 1 onion in butter, add 2 heads broccoli in pieces and 8 dl stock.", "Simmer for 15 min until tender.", "Blend smooth (and add a splash of milk).", "Off the heat, stir in 150 g grated cheese and 1 tsp mustard until melted."], "Carrot and ginger soup": ["Soften 1 onion and 2 tbsp grated ginger in oil for 5 min.", "Add 800 g sliced carrots and 1 litre stock.", "Simmer for 20 min until very soft.", "Blend with 1 can coconut milk (or cream) and the juice of 1 orange. Season."], "Sweet potato soup": ["Soften 1 onion with 2 tsp curry powder and ginger.", "Add 800 g cubed sweet potato and 8 dl stock. Simmer for 20 min.", "Blend with 1 can coconut milk.", "Season with lime and salt."], "Minestrone": ["Soften 1 onion, 2 carrots and 2 celery stalks, all diced, in olive oil for 8 min.", "Add garlic, 1 can tomatoes, 1.2 litres stock and 1 can beans. Simmer for 15 min.", "Add 1 diced zucchini and 1.5 dl small pasta and cook for 10 min.", "Serve with parmesan and olive oil."], "Chicken noodle soup": ["Put 500 g chicken, 1 onion, 2 carrots and 2 celery stalks in 1.5 litres stock.", "Simmer for 25 min until the chicken is cooked.", "Lift out the chicken, shred it and return it.", "Add 150 g noodles and cook for 5 min. Finish with parsley and salt."], "Chicken and rice soup": ["Simmer 500 g chicken with carrots, onion and celery in 1.5 litres stock for 20 min.", "Add 1 dl rice and cook for 15 min.", "Shred the chicken back in.", "Finish with lemon juice and parsley."], "Thai coconut chicken soup": ["Simmer 8 dl stock with 6 slices of ginger for 5 min.", "Add 1 can coconut milk and 400 g thinly sliced chicken (and mushrooms).", "Simmer gently for 10 min until the chicken is cooked.", "Season with 2 tbsp fish sauce and the juice of 1–2 limes. Top with chili and cilantro."], "Spicy coconut shrimp soup": ["Fry 2 tbsp curry paste in oil for 1 min.", "Add 5 dl stock and 1 can coconut milk and simmer for 5 min.", "Add 300 g shrimp and sliced mushrooms and cook for 4 min.", "Season with lime and fish sauce."], "Quick ramen": ["Boil eggs for 6.5 min, cool in cold water and peel.", "Simmer 1.2 litres stock with 3 tbsp soy and 1 tsp sesame oil (plus garlic and ginger).", "Cook 300 g noodles in the broth for 3–4 min, adding spinach for the last minute.", "Ladle into bowls and top with halved eggs, sliced chicken and spring onion."], "Egg drop soup": ["Bring 1 litre seasoned stock to a simmer with a slice of ginger and 1 tbsp soy.", "Thicken with 1 tbsp cornstarch mixed in water.", "Stir the soup in a circle and slowly pour in 2 beaten eggs so they form ribbons.", "Top with spring onion."], "French onion soup": ["Slice 1 kg onions thin.", "Cook in 50 g butter on low for 40–50 min, stirring now and then, until deep brown and sweet.", "Stir in 1 tbsp flour, then add 1.2 litres stock and thyme. Simmer for 15 min.", "Ladle into ovenproof bowls, top with toasted bread and lots of cheese.", "Grill until bubbling."], "Green pea soup": ["Soften 1 onion in butter for 5 min.", "Add 600 g frozen peas and 7 dl stock. Simmer for 5 min.", "Blend smooth and season.", "Top with crispy bacon or a swirl of cream."], "Spinach soup with egg": ["Simmer 2 diced potatoes and 1 onion in 1 litre stock for 15 min.", "Add 300 g spinach and cook for 2 min.", "Blend with a splash of cream and nutmeg.", "Serve with halved boiled eggs."], "Cauliflower soup": ["Soften 1 onion in butter.", "Add 1 head cauliflower and 1 litre stock and simmer for 20 min.", "Blend smooth with cream or grated cheese.", "Season with nutmeg and salt."], "Norwegian fish soup": ["Cut 2 carrots, 1 leek (and 1 potato) into thin strips.", "Simmer in 1 litre fish or vegetable stock for 8 min.", "Add 3 dl cream and simmer for 5 min. Season.", "Add 500 g fish in chunks and simmer very gently for 4 min. Add shrimp at the end.", "Top with dill."], "Kjøttsuppe (meat and root vegetable soup)": ["Put 800 g beef for soup in 2 litres cold water with salt and a bay leaf.", "Bring to the boil, skim off the foam and simmer for 1 hour.", "Add diced carrots, swede, potatoes and leek. Simmer for 30 min.", "Lift out the meat, cut into pieces and return. Season well."], "Taco soup": ["Brown 400 g mince with 1 bag taco spice.", "Add 1 can tomatoes, 1 can beans, 1 can corn and 8 dl stock.", "Simmer for 20 min.", "Serve with cheese, sour cream and crushed tortilla chips."], "Black bean soup": ["Soften 1 onion, 2 garlic cloves and 2 tsp cumin in oil.", "Add 2 cans black beans and 8 dl stock. Simmer for 15 min.", "Blend half and stir back in.", "Finish with lime. Top with sour cream and chili."], "White bean and spinach soup": ["Soften 1 onion and 3 garlic cloves in olive oil with rosemary.", "Add 2 cans white beans and 1 litre stock. Simmer for 15 min, mashing some beans.", "Stir in 200 g spinach.", "Serve with parmesan."], "Coconut lentil soup": ["Soften 1 onion, ginger and 1 tbsp curry powder.", "Add 2 dl red lentils, 1 can coconut milk and 8 dl stock.", "Simmer for 20 min.", "Add spinach and lime."], "Harira-style lentil and chickpea soup": ["Soften 1 onion and celery with 1 tsp cumin and 1 tsp cinnamon.", "Add 1 can tomatoes, 1.5 dl red lentils, 1 can chickpeas and 1.2 litres water.", "Simmer for 30 min.", "Finish with lemon juice and cilantro."], "Mulligatawny": ["Soften 1 onion with 1 tbsp curry powder.", "Add 1.5 dl red lentils, 1 grated apple, 400 g diced chicken and 1.2 litres stock.", "Simmer for 30 min.", "Blend partly and add coconut milk. Serve with rice."], "Gazpacho": ["Roughly chop 800 g ripe tomatoes, ½ cucumber, 1 pepper and 1 garlic clove.", "Blend with 4 tbsp olive oil, 2 tbsp vinegar, salt and a slice of bread.", "Thin with cold water to the right consistency.", "Chill for at least 1 hour. Serve very cold."], "Chicken tortilla soup": ["Soften 1 onion with 2 tsp cumin.", "Add 1 can tomatoes, 1 litre stock and 400 g chicken. Simmer for 20 min.", "Shred the chicken and add beans and corn.", "Serve topped with crushed chips, avocado and lime."], "Hungarian goulash soup": ["Brown 600 g beef cubes with 2 onions.", "Stir in 2 tbsp paprika and 1 tbsp tomato paste.", "Add 1.5 litres stock and simmer for 1 hour.", "Add 3 diced potatoes and 1 pepper and cook for 25 min."], "Cabbage soup": ["Soften 1 onion and 2 carrots (and bacon) for 8 min.", "Add ½ shredded cabbage, 1 can tomatoes and 1.2 litres stock.", "Simmer for 25 min. Season well."], "Beetroot soup (borscht)": ["Soften 1 onion and 2 grated carrots.", "Add 3 grated beetroots and cook for 5 min.", "Add 2 diced potatoes, ¼ shredded cabbage and 1.5 litres stock. Simmer for 30 min.", "Add 1 tbsp vinegar and season. Serve with sour cream and dill."], "Sausage and potato soup": ["Fry 300 g sliced sausage and 1 onion for 5 min.", "Add 4 diced potatoes and 1 litre stock and simmer for 20 min.", "Mash some potatoes into the soup.", "Stir in spinach and a splash of cream."], "Corn chowder": ["Fry 100 g bacon and 1 onion for 5 min.", "Add 3 diced potatoes and 5 dl water and simmer for 15 min.", "Add 2 cans corn and 5 dl milk (and cream).", "Warm through and blend a quarter of it to thicken."], "Fish chowder": ["Fry 100 g bacon and 1 onion for 5 min.", "Add 3 diced potatoes and 5 dl water and simmer for 15 min.", "Add 5 dl milk and 400 g fish in chunks (and corn).", "Simmer gently for 5 min. Add dill."], "Salmon soup": ["Simmer 3 diced potatoes, 1 leek and a carrot in 1 litre stock for 15 min.", "Add 2 dl cream.", "Add 400 g salmon in cubes and simmer gently for 5 min.", "Top with lots of dill."], "Zucchini soup": ["Soften 1 onion and 2 garlic cloves in olive oil.", "Add 3 sliced zucchini and cook for 5 min.", "Add 8 dl stock and simmer for 10 min.", "Blend with cream or parmesan."], "Roasted tomato and red pepper soup": ["Heat the oven to 200°C. Put 800 g tomatoes, 2 peppers, 1 onion and 4 garlic cloves on a tray with oil and salt.", "Roast for 30–35 min until soft and charred.", "Blend with 6 dl hot stock.", "Season and add basil or cream."], "African peanut stew": ["Soften 1 onion and ginger in oil.", "Add 600 g cubed sweet potato, 1 can tomatoes and 8 dl stock (and chicken). Simmer for 20 min.", "Stir in 5 tbsp peanut butter until smooth.", "Add spinach and chili and cook for 2 min."], "Hot and sour soup": ["Simmer 1 litre stock with sliced mushrooms for 5 min.", "Add 200 g tofu in strips, 3 tbsp vinegar, 2 tbsp soy and lots of pepper.", "Thicken with 2 tbsp cornstarch in water.", "Drizzle in 1 beaten egg while stirring. Top with spring onion."], "Chicken and corn soup": ["Simmer 1 litre stock with ginger, 300 g shredded chicken and 1 can corn for 10 min.", "Thicken with 1 tbsp cornstarch in water.", "Drizzle in 2 beaten eggs.", "Top with spring onion."], "Bean and bacon soup": ["Fry 150 g bacon and 1 onion for 5 min.", "Add 2 carrots, 1 tbsp tomato paste, 2 cans beans and 1 litre stock.", "Simmer for 25 min. Mash some beans to thicken."], "Chicken Caesar salad": ["Fry 2 chicken breasts for 5–6 min per side and slice.", "Toss bread cubes in oil and bake at 200°C for 8 min until crisp.", "Dressing: 4 tbsp mayo, 1 tbsp lemon juice, 1 garlic clove, 1 tsp mustard and 3 tbsp grated parmesan. Thin with water.", "Toss lettuce with the dressing, then top with chicken, croutons and more parmesan."], "Greek salad": ["Cut tomatoes and cucumber into chunks and slice red onion thin.", "Add olives and a slab of feta on top.", "Drizzle with olive oil and sprinkle with oregano and salt."], "Couscous salad": ["Pour 3 dl boiling water with a pinch of salt over 3 dl couscous. Cover for 5 min, then fluff with a fork.", "Add diced tomato and cucumber (and chickpeas, feta and parsley).", "Dress with lemon juice, olive oil and salt."], "Quinoa salad": ["Rinse 2 dl quinoa and simmer in 4 dl water for 15 min. Cool.", "Mix with cucumber, tomato and chickpeas.", "Add feta and avocado.", "Dress with lemon and olive oil."], "Chickpea salad": ["Drain 2 cans chickpeas.", "Mix with chopped cucumber, tomato and red onion.", "Dress with lemon, olive oil and salt. Add feta and parsley."], "Tuna salad": ["Boil 4 eggs for 9 min, cool and halve.", "Arrange lettuce, tomato, cucumber and corn on plates.", "Top with tuna, eggs and olives.", "Dress with oil and vinegar."], "Egg salad sandwich": ["Boil 6 eggs for 10 min, cool and peel.", "Chop and mix with 3 tbsp mayo, 1 tsp mustard, salt and spring onion.", "Spread thickly on bread."], "BLT sandwich": ["Fry 8 slices of bacon until crisp.", "Toast the bread and spread with mayo.", "Layer lettuce, tomato slices (salted) and bacon."], "Grilled cheese": ["Butter the outside of 2 slices of bread.", "Put cheese (and ham) between the unbuttered sides.", "Fry on medium-low for 3 min per side until golden and melted. Press down gently."], "Croque monsieur": ["Make a small, thick white sauce: 1 tbsp butter, 1 tbsp flour, 1.5 dl milk.", "Spread bread with mustard and fill with ham and cheese.", "Spread sauce on top and add more cheese.", "Grill or bake at 220°C for 8 min until bubbling."], "Club sandwich": ["Toast 3 slices of bread per sandwich and spread with mayo.", "Layer 1: sliced cooked chicken and lettuce. Layer 2: bacon, tomato (and egg).", "Pin with toothpicks and cut into quarters."], "Chicken wrap": ["Warm the tortillas.", "Fill with sliced cooked chicken, lettuce, tomato and cheese.", "Add sweet chili sauce or mayo and roll up tightly."], "Halloumi wrap": ["Fry halloumi slices for 2 min per side.", "Fill warm tortillas with lettuce, tomato and halloumi.", "Add sweet chili and roll up."], "Falafel wrap": ["Make or warm falafel.", "Fill wraps with lettuce, tomato, cucumber and falafel.", "Drizzle with yogurt or tahini sauce and roll."], "Tuna melt": ["Mix 1 can tuna with 3 tbsp mayo and red onion.", "Spread on bread and top with cheese.", "Grill for 4–5 min until bubbling."], "Toast Skagen": ["Chop 300 g shrimp roughly.", "Mix with 3 tbsp mayo (or half crème fraîche), dill, lemon and red onion.", "Fry slices of bread in butter until golden.", "Pile the shrimp mix on top and garnish with dill and lemon."], "Smoked salmon and egg open sandwich": ["Boil eggs for 8 min and slice.", "Butter the bread and top with smoked salmon and egg slices.", "Finish with dill, lemon and cucumber."], "Avocado toast": ["Toast the bread.", "Mash 1 avocado with lemon juice and salt.", "Spread thickly and top with chili flakes, feta or a fried egg."], "Classic potato salad": ["Boil 1 kg small potatoes until tender, cool and cut in pieces.", "Mix 1 dl mayo, 1 dl sour cream, 1 tsp mustard and salt.", "Fold in the potatoes with red onion and dill. Chill for 30 min."], "Coleslaw": ["Finely shred ¼ cabbage and grate 2 carrots.", "Mix with 4 tbsp mayo, 1 tbsp vinegar, 1 tsp sugar and salt.", "Rest for 15 min before serving."], "Caprese salad": ["Slice tomatoes and mozzarella.", "Layer alternately with basil leaves.", "Drizzle with olive oil (and balsamic) and add salt."], "Niçoise salad": ["Boil 500 g potatoes, add 200 g green beans for the last 4 min. Boil 4 eggs for 8 min.", "Make a dressing with mustard, vinegar and olive oil.", "Arrange lettuce, potatoes, beans, tomato, tuna, olives and halved eggs.", "Pour over the dressing."], "Taco salad": ["Brown 400 g mince with taco spice.", "Arrange lettuce, tomato and corn on plates.", "Top with the mince and cheese.", "Add crushed tortilla chips and sour cream."], "Asian noodle salad": ["Cook 250 g noodles, rinse in cold water and drain.", "Shred cabbage and carrot.", "Dressing: 3 tbsp soy, juice of 1 lime, 1 tbsp sesame oil (and 1 tbsp peanut butter).", "Toss everything and top with nuts and cilantro."], "Three-bean salad": ["Drain beans, chickpeas and cooked green beans.", "Toss with red onion, oil, vinegar, salt and parsley.", "Rest for 15 min."], "Fattoush with pita": ["Tear 2 pitas, toss with oil and bake at 200°C for 8 min until crisp.", "Chop tomato, cucumber, lettuce and red onion.", "Dress with lemon, olive oil and salt.", "Toss with the pita just before serving."], "Banh mi-style sandwich": ["Grate 2 carrots and toss with 3 tbsp vinegar and 1 tsp sugar. Rest for 15 min.", "Fry 300 g thin pork with soy until caramelised.", "Spread baguettes with mayo and sriracha.", "Fill with pork, pickled carrot, cucumber and cilantro."], "Halloumi and couscous salad": ["Make 2 dl couscous.", "Fry halloumi slices until golden.", "Mix the couscous with cucumber, tomato, parsley and lemon.", "Top with the halloumi."], "Waldorf salad": ["Dice 2 apples and 2 celery stalks.", "Mix with a handful of nuts (and raisins) and 3 tbsp mayo.", "Serve on lettuce."], "Pasta salad with ham and peas": ["Cook 300 g pasta, rinse and cool.", "Mix with 200 g diced ham, 2 dl peas and corn.", "Add 4 tbsp mayo and season."], "Chicken pita pocket": ["Warm pitas and split open.", "Fill with sliced cooked chicken, lettuce and tomato.", "Add yogurt mixed with garlic."], "Chili con carne with chocolate": ["Brown 500 g mince, add 1 onion and 3 garlic cloves.", "Add 2 tsp cumin, 1 tsp cinnamon and chili.", "Add 2 cans tomatoes and 1 can beans. Simmer for 40 min.", "Stir in 20 g dark chocolate until melted. Serve with rice."], "Chicken mince chili": ["Brown 500 g chicken mince in oil.", "Add 1 onion, 1 pepper, 2 tsp paprika and 2 tsp cumin.", "Add 2 cans tomatoes, 1 can beans and corn.", "Simmer for 25 min."], "Chickpea shakshuka": ["Soften 1 onion with 1 tsp cumin and paprika.", "Add 1 can tomatoes and 1 can chickpeas and simmer for 10 min.", "Crack in 4 eggs, cover and cook for 6–8 min.", "Top with feta and serve with bread."], "Spicy sausage shakshuka": ["Fry 150 g chorizo with 1 onion and pepper for 5 min.", "Add 2 cans tomatoes and simmer for 10 min.", "Crack in 4–6 eggs, cover and cook for 6–8 min. Serve with bread."], "Baked eggs with spinach and feta": ["Heat the oven to 190°C.", "Wilt 300 g spinach in a pan and spread in an ovenproof dish (with a splash of cream).", "Make wells, crack in 4 eggs and crumble feta over.", "Bake for 10–12 min until the whites are set."], "Fried rice with bacon and egg": ["Fry 150 g bacon until crisp.", "Add 6 dl cold rice and peas and stir-fry for 4 min.", "Push aside and scramble 2 eggs. Mix with 2–3 tbsp soy."], "Spicy pork rice bowl": ["Cook the rice.", "Fry 400 g thin pork with 2 garlic cloves for 4 min.", "Add 2 tbsp soy and 1–2 tbsp sriracha and toss.", "Serve over rice with cucumber and a fried egg."], "Lemon pepper chicken with rice": ["Cook the rice.", "Season 8 chicken thighs with the zest of 1 lemon, 1 tsp coarse pepper and salt.", "Fry for 6 min per side until golden and cooked.", "Add butter, garlic and lemon juice to the pan and spoon over. Serve with rice and broccoli."], "Paprika chicken with sour cream": ["Brown 600 g chicken pieces with 1 onion and pepper.", "Stir in 2 tbsp paprika for 30 seconds.", "Add 2 dl water and simmer for 15 min.", "Off the heat, stir in 2 dl sour cream. Serve with rice or pasta."], "Chicken with pesto and mozzarella": ["Heat the oven to 200°C.", "Put 4 chicken breasts in a dish and spread 1 tbsp pesto over each.", "Top with tomato slices and mozzarella.", "Bake for 25 min until cooked through."], "Bacon-wrapped chicken": ["Heat the oven to 200°C.", "Season 4 chicken breasts (and spread with cream cheese if using).", "Wrap each in 2–3 slices of bacon.", "Roast for 25 min until the bacon is crisp and the chicken cooked."], "Salmon with pesto crust": ["Heat the oven to 200°C.", "Spread 1 tbsp pesto over each of 4 salmon fillets.", "Sprinkle with breadcrumbs and a little oil.", "Bake for 12–15 min. Serve with green beans and lemon."], "Mustard-crusted cod": ["Heat the oven to 200°C.", "Spread 1 tbsp mustard over each cod fillet.", "Mix 1 dl breadcrumbs with 2 tbsp melted butter and press on top.", "Bake for 15 min. Serve with potatoes and lemon."], "Creamy shrimp and spinach": ["Fry 2 garlic cloves in butter, add 400 g shrimp and cook for 2 min.", "Add 2 dl cream and 2 handfuls of spinach.", "Simmer for 2 min. Serve with rice or pasta."], "Sausage and lentil stew": ["Brown 6 sausages with 1 onion and carrot.", "Add 2 dl red lentils, 1 can tomatoes, paprika and 7 dl stock.", "Simmer for 25 min until thick."], "Chorizo and chickpea stew": ["Fry 150 g chorizo and 1 onion for 5 min.", "Add 2 cans chickpeas, 1 can tomatoes and 1 tsp smoked paprika.", "Simmer for 15 min. Stir in spinach and serve with bread."], "Chicken and leek pie": ["Soften 2 sliced leeks in butter.", "Add 400 g cooked chicken, 2 dl cream and mustard. Simmer for 3 min.", "Pour into a dish and cover with puff pastry.", "Bake at 200°C for 30 min."], "Mince and potato bake": ["Heat the oven to 200°C. Brown 500 g mince with onion, add 1 can tomatoes and oregano.", "Slice 800 g potatoes thin.", "Layer potatoes and mince in a dish, ending with potatoes.", "Cover with foil and bake for 30 min. Uncover, add cheese and bake for 15 min more."], "Potato gratin with ham": ["Heat the oven to 180°C.", "Slice 1 kg potatoes thin.", "Layer in a dish with 200 g ham, garlic and salt.", "Pour over 4 dl cream and top with cheese.", "Bake for 60 min until soft and golden."], "Cauliflower cheese bake": ["Boil 1 head cauliflower in florets for 5 min and drain.", "Make a cheese sauce with 2 tbsp butter, 2 tbsp flour, 5 dl milk, 150 g cheese and mustard.", "Pour over the cauliflower in a dish and top with breadcrumbs.", "Bake at 200°C for 25 min."], "Stuffed mushrooms with cream cheese": ["Heat the oven to 200°C. Remove the stalks from 12 large mushrooms and chop them.", "Mix the stalks with 150 g cream cheese and garlic.", "Fill the caps and top with parmesan or breadcrumbs.", "Bake for 15 min."], "Halloumi and chickpea curry": ["Fry 250 g halloumi cubes until golden, set aside.", "Make a curry: onion, 2 tbsp curry powder, 1 can tomatoes, 1 can coconut milk and 1 can chickpeas. Simmer for 15 min.", "Add spinach and the halloumi. Serve with rice."], "Tofu tikka masala": ["Toss 400 g tofu cubes in 1 dl yogurt and garam masala and roast at 220°C for 20 min.", "Fry onion, garlic and ginger with spices, add 1 can tomatoes and simmer for 10 min.", "Add 1 dl cream and the tofu. Serve with rice."], "Lentil shepherd's pie": ["Soften 1 onion and 2 carrots, add 2 tbsp tomato paste.", "Add 2 dl red lentils, 5 dl stock and thyme and simmer for 20 min (add peas).", "Top with mash from 1 kg potatoes.", "Bake at 200°C for 25 min."], "Sweet potato and black bean tacos": ["Roast 600 g sweet potato cubes with oil and cumin at 220°C for 25 min.", "Warm 1 can beans.", "Fill tortillas with both and add avocado, sour cream and lime."], "Pulled chicken sandwiches": ["Simmer 600 g chicken thighs in 4 tbsp ketchup, 2 tbsp honey, 2 tbsp vinegar, 1 tsp paprika and 1 dl water for 25 min.", "Shred with two forks and stir back into the sauce.", "Serve in buns with shredded cabbage."], "BBQ-style sticky ribs": ["Heat the oven to 160°C. Season 1.5 kg pork ribs with salt and paprika.", "Wrap tightly in foil and bake for 1.5–2 hours until tender.", "Mix 1 dl ketchup, 3 tbsp honey, 2 tbsp vinegar, 1 tbsp worcestershire and garlic.", "Unwrap, brush with sauce and roast at 220°C for 15 min, brushing twice more."], "Beef and potato hash": ["Fry 600 g diced potatoes in oil for 15 min until crisp.", "Add 1 onion and 300 g diced cooked beef and fry for 5 min.", "Add a splash of worcestershire.", "Top with fried eggs."], "Chicken nachos bake": ["Heat the oven to 200°C.", "Layer tortilla chips, shredded chicken, beans and cheese on a tray.", "Bake for 10 min until melted.", "Top with salsa, sour cream and avocado."], "Chicken and broccoli bake": ["Heat the oven to 200°C.", "Put 400 g cooked chicken and blanched broccoli in a dish.", "Mix 3 dl cream with 1 tbsp mustard and salt and pour over.", "Top with cheese and bake for 25 min. Serve with rice."], "Leek and bacon pasta bake": ["Cook 300 g pasta for 2 min less than the packet says.", "Fry 150 g bacon and 2 leeks for 8 min.", "Mix with the pasta, 2.5 dl cream and mustard in a dish.", "Top with cheese and bake at 200°C for 20 min."], "Salmon teriyaki noodle stir-fry": ["Cook 300 g noodles.", "Pan-fry 400 g salmon cubes for 4 min.", "Stir-fry broccoli, then add the noodles.", "Glaze everything with 3 tbsp soy and 2 tbsp honey (and ginger)."], "Veggie fried rice with tofu": ["Fry 300 g tofu cubes until crisp.", "Add carrot and peas, then 6 dl cold rice, and stir-fry for 4 min.", "Scramble 2 eggs in and season with soy."], "Chicken shawarma rice bowl": ["Cook the rice.", "Toss chicken with cumin, paprika and garlic, then fry or roast until charred.", "Mix yogurt with garlic.", "Serve over rice with cucumber and tomato."], "Lamb and chickpea tagine": ["Brown 800 g lamb cubes with 1 onion, 1 tsp cumin and 1 tsp cinnamon.", "Add 1 can tomatoes and 4 dl water and simmer for 1 hour.", "Add 1 can chickpeas and raisins and cook for 15 min.", "Serve with couscous."], "Bean and rice skillet": ["Fry 1 onion with 1 tsp cumin.", "Add 2 dl rice, 1 can tomatoes and 3 dl water. Cover and cook for 18 min.", "Stir in 1 can beans and corn.", "Top with cheese and let it melt."], "Sausage and pepper rolls": ["Fry 6 sausages for 10 min.", "Add 2 sliced peppers and 1 onion and cook for 8 min.", "Serve in rolls with mustard and ketchup."], "Egg fried noodles with shrimp": ["Cook 300 g noodles.", "Fry 300 g shrimp and garlic for 2 min, then push aside and scramble 2 eggs.", "Toss with the noodles and 3 tbsp soy. Top with spring onion."], "American pancakes": ["Makes about 12. Whisk 2.5 dl flour, 2 tsp baking powder, 1 tbsp sugar and a pinch of salt in a bowl.", "In another bowl, whisk 1 egg, 2.5 dl milk and 2 tbsp melted butter.", "Pour the wet into the dry and stir only until just combined. Lumps are fine and keep them fluffy.", "Heat a pan on medium and brush with butter. Pour in about 3 tbsp batter per pancake.", "Flip when bubbles cover the top and the edges look dry (about 2 min), then cook 1 min more.", "Serve with berries, honey or bacon."], "Banana pancakes (two ingredients)": ["Serves 1. Mash 1 ripe banana until smooth.", "Whisk in 2 eggs (and a pinch of cinnamon or 2 tbsp oats to make them firmer).", "Heat butter in a non-stick pan on medium-low.", "Pour small pancakes of about 2 tbsp each. They are fragile, so keep them small.", "Flip gently after 1–2 min when set underneath, and cook 1 min more."], "Blueberry pancakes": ["Make the American pancake batter.", "Pour pancakes into the buttered pan.", "Drop a few berries onto each pancake while the top is still wet.", "Flip when bubbles appear and cook 1 min more.", "Serve with honey."], "Oat pancakes": ["Blend 2 dl oats, 2 eggs, 2 dl milk (and 1 banana and 1 tsp baking powder) until smooth.", "Rest for 5 min to thicken.", "Fry small pancakes in butter on medium for 2 min per side."], "Cottage cheese pancakes": ["Mix 2 dl cottage cheese, 2 eggs and 4 tbsp flour with a pinch of salt.", "Heat butter in a pan on medium.", "Fry spoonfuls for 2 min per side until golden.", "Serve with berries and honey."], "Apple cinnamon pancakes": ["Make the American pancake batter and add 1 tsp cinnamon.", "Grate 1 apple and fold it in.", "Fry in butter on medium for 2 min per side.", "Serve with a sprinkle of cinnamon sugar."], "Chocolate chip pancakes": ["Make the American pancake batter.", "Fold in 50 g chopped chocolate.", "Fry on medium-low so the chocolate does not burn, about 2 min per side."], "Crêpes with ham and cheese": ["Whisk 2 dl flour, 4 dl milk, 2 eggs and a pinch of salt. Rest for 15 min, then stir in 2 tbsp melted butter.", "Fry thin crêpes in a buttered pan for 1 min per side.", "Put a crêpe back in the pan, add ham and cheese (and mustard) to one half, fold and fold again.", "Cook for 1 min until the cheese melts."], "Dutch baby": ["Heat the oven to 220°C. Put 2 tbsp butter in a 25 cm ovenproof pan and heat it in the oven.", "Blend 3 eggs, 1.5 dl flour, 1.5 dl milk and a pinch of salt until smooth.", "Pour into the sizzling pan and bake for 18–20 min without opening the door, until puffed and golden.", "Dust with icing sugar and serve with lemon or berries."], "Potato pancakes (raggmunk) with bacon": ["Whisk 2.5 dl flour, 5 dl milk, 2 eggs and salt into a batter.", "Grate 600 g raw potatoes, squeeze out the liquid and stir into the batter.", "Fry thin pancakes in plenty of butter on medium for 3 min per side until crisp.", "Serve with crispy bacon and lingonberry jam."], "Rösti": ["Parboil 600 g whole potatoes for 8 min and cool. Grate coarsely (with ½ onion).", "Season with salt and pepper.", "Heat butter and oil in a pan and press the potato in evenly.", "Fry on medium for 10 min until golden underneath.", "Flip with a plate and fry 8 min more. Top with a fried egg."], "Zucchini fritters": ["Grate 2 zucchini, toss with ½ tsp salt and leave for 10 min. Squeeze out as much water as you can.", "Mix with 1 egg, 4 tbsp flour, 100 g crumbled feta and garlic.", "Fry spoonfuls in oil, flattened, for 3 min per side until golden.", "Serve with sour cream."], "Corn fritters": ["Mix 1 drained can corn, 1 egg, 6 tbsp flour, ½ tsp baking powder, salt and spring onion.", "Fry spoonfuls in oil for 2–3 min per side.", "Serve with sweet chili sauce."], "Sveler": ["Makes about 12. Whisk 2 eggs with 1 dl sugar until light.", "Add 5 dl milk (or kefir), then 5 dl flour and 1 tsp baking soda. Whisk smooth. Add cardamom if using.", "Stir in 2 tbsp melted butter. Rest for 10 min.", "Fry thick pancakes (about ¾ dl batter) on medium-low for 2 min per side.", "Serve with butter and sugar, or brown cheese."], "Norwegian waffles (vafler)": ["Whisk 4 eggs and 1 dl sugar until light.", "Add 5 dl flour and 5 dl milk alternately, whisking smooth. Add 1 tsp cardamom or vanilla.", "Stir in 100 g melted butter and rest for 15 min.", "Heat the waffle iron and brush with butter. Pour in about 1 dl batter and bake until golden.", "Cool on a rack so they stay crisp. Serve with jam and sour cream or brown cheese."], "Sour cream waffles (rømmevafler)": ["Mix 3 dl sour cream, 2 eggs, 3 tbsp sugar and 3 dl flour into a thick batter.", "Add 2 tbsp melted butter and cardamom. Thin with a little water if needed.", "Bake in a buttered waffle iron until golden.", "Serve with jam."], "Chocolate waffles": ["Make Norwegian waffle batter but swap 3 tbsp flour for 3 tbsp cocoa.", "Add vanilla.", "Bake in the waffle iron. They burn more easily, so watch them."], "Yeast waffles": ["Warm 4 dl milk to body temperature and dissolve 1 tsp dry yeast in it.", "Whisk in 4 dl flour, 2 eggs, 2 tbsp sugar, 75 g melted butter and a pinch of salt.", "Cover and leave to rise for 1 hour until bubbly.", "Bake in a hot waffle iron until crisp and golden."], "French toast (arme riddere)": ["Whisk 2 eggs, 2 dl milk, 1 tsp cinnamon and a pinch of sugar.", "Dip slices of slightly stale bread for 10 seconds per side.", "Fry in butter on medium for 2–3 min per side until golden.", "Serve with sugar and berries."], "Baked oats": ["Serves 1. Heat the oven to 180°C.", "Mash 1 banana, mix with 1 dl oats, 1 egg, 1 dl milk and ½ tsp baking powder (and cinnamon).", "Pour into a small greased dish and top with berries or chocolate.", "Bake for 20–25 min until set and golden."], "Overnight oats": ["Serves 1. In a jar, mix 1 dl oats, 1 dl milk and 1 dl yogurt (and 1 tsp honey).", "Cover and leave in the fridge overnight.", "In the morning, stir and top with berries, banana or peanut butter."], "Rice porridge (risgrøt)": ["Serves 4. Boil 2 dl short-grain rice in 3 dl water for 10 min until the water is absorbed.", "Add 1 litre milk and bring to a simmer.", "Cook on low for 45–50 min, stirring often so it does not catch, until thick and creamy.", "Season with ½ tsp salt.", "Serve with butter, sugar and cinnamon."], "Homemade granola": ["Heat the oven to 160°C.", "Mix 5 dl oats, 2 dl nuts (and coconut) with 1 tsp cinnamon and a pinch of salt.", "Warm 4 tbsp honey with 3 tbsp oil and stir through until everything is coated.", "Spread on a lined tray and bake for 20–25 min, stirring once, until golden.", "Cool completely (it crisps as it cools) and add raisins. Store in a jar."], "Creamy scrambled eggs": ["Whisk 3 eggs with a pinch of salt.", "Melt 1 tbsp butter in a pan on low.", "Add the eggs and stir slowly and constantly with a spatula.", "Take them off the heat while still soft and slightly runny, as they keep cooking.", "Serve on toast with spring onion or cheese."], "Egg muffins": ["Makes 12. Heat the oven to 180°C and grease a muffin tin.", "Whisk 8 eggs with salt and pepper.", "Add chopped ham, spinach, pepper and cheese.", "Divide into the tin and bake for 18–20 min until set.", "Keeps for 4 days in the fridge."], "Breakfast burrito": ["Scramble 4 eggs softly.", "Warm 2 large tortillas.", "Fill with eggs, cheese, crispy bacon or fried potatoes, and salsa.", "Roll up and toast in a dry pan for 1 min per side."], "Turkish eggs (çılbır)": ["Mix 3 dl yogurt with 1 grated garlic clove and salt and spread in shallow bowls.", "Poach 4 eggs in simmering water with a dash of vinegar for 3 min.", "Melt 2 tbsp butter with 1 tsp paprika (and chili flakes).", "Put the eggs on the yogurt and drizzle over the butter. Serve with bread."], "Eggs Benedict": ["Hollandaise: whisk 2 yolks and 1 tbsp lemon juice in a bowl over simmering water.", "Add 100 g melted butter slowly, whisking, until thick. Season with salt.", "Poach 4 eggs for 3 min.", "Toast the bread or muffins and add ham.", "Top with an egg and spoon over the hollandaise."], "Poached eggs on toast": ["Bring a pan of water to a gentle simmer and add a dash of vinegar.", "Crack each egg into a cup, stir the water and slide the egg in.", "Cook for 3 min, then lift out with a slotted spoon.", "Serve on buttered toast or avocado."], "Ham and cheese omelette": ["Beat 3 eggs with salt.", "Melt butter in a pan on medium and pour in the eggs.", "Stir for 20 seconds, then let it set for 1 min.", "Add ham and cheese to one half, fold over and cook 30 seconds more."], "Mushroom omelette": ["Fry 100 g sliced mushrooms in butter for 4 min until browned. Remove.", "Beat 3 eggs and pour into the pan.", "Let it set, add the mushrooms (and cheese) and fold."], "Spinach and feta frittata": ["Soften 1 onion in an ovenproof pan (with sliced cooked potato).", "Add 150 g spinach until wilted.", "Whisk 6 eggs with salt, pour in and crumble over 100 g feta.", "Cook on low for 6–8 min until the edges set.", "Finish under the grill for 3 min until puffed and golden."], "Breakfast hash with eggs": ["Dice 600 g potatoes and fry in oil for 15 min until crisp.", "Add onion and pepper (and bacon) and fry for 5 min.", "Make wells and crack in 4 eggs.", "Cover and cook for 4–5 min until the whites are set."], "Smoothie bowl": ["Blend 2 dl frozen berries, 1 frozen banana and 1 dl yogurt until thick. Add as little liquid as possible.", "Spoon into a bowl.", "Top with oats or granola, nuts and fresh fruit."], "Yogurt parfait": ["Layer yogurt, berries and granola or oats in a glass.", "Repeat the layers.", "Drizzle with honey and add nuts."], "Huevos rancheros": ["Simmer 1 can tomatoes with 1 chopped onion and chili for 10 min.", "Warm tortillas and a can of beans.", "Fry 4 eggs.", "Put an egg on each tortilla with beans and sauce. Top with cheese and avocado."], "Full English-style breakfast": ["Fry 4 sausages on medium for 10 min.", "Add bacon, halved tomatoes and mushrooms and cook for 5 min.", "Warm a can of beans.", "Fry eggs in the same pan and toast bread."], "Bacon and egg sandwich": ["Fry 3 slices of bacon until crisp.", "Fry an egg in the fat.", "Put on buttered toast with ketchup (and cheese)."], "Banana oat porridge": ["Serves 1. Simmer 1 dl oats in 2 dl milk for 4 min.", "Mash in ½ banana and slice the other half on top.", "Add cinnamon and peanut butter or honey."], "Apple cinnamon porridge": ["Serves 1. Grate ½ apple.", "Simmer with 1 dl oats, 2 dl milk and ½ tsp cinnamon for 4–5 min.", "Top with raisins and honey."], "Savory oats with egg": ["Serves 1. Simmer 1 dl oats in 2.5 dl stock for 4 min.", "Fry an egg.", "Top the oats with the egg, cheese, spring onion and a dash of soy."], "Pancake stack with bacon and syrup": ["Make American pancakes.", "Fry 8 slices of bacon until crisp.", "Stack pancakes with bacon and butter.", "Drizzle with honey or syrup."], "Crêpes with jam": ["Whisk 2 dl flour, 4 dl milk, 2 eggs and a pinch of salt and rest for 15 min.", "Stir in 2 tbsp melted butter.", "Fry thin crêpes for 1 min per side.", "Spread with jam, roll up and dust with sugar."], "Beetroot hummus": ["Blend 1 can chickpeas, 1 cooked beetroot, 2 tbsp tahini, juice of 1 lemon and 1 garlic clove.", "Add salt and cumin and blend until very smooth, adding water if needed.", "Serve with bread or vegetables."], "Roasted red pepper hummus": ["Roast 1 pepper at 220°C for 25 min until blackened, then peel. Or use a jarred one.", "Blend with 1 can chickpeas, 2 tbsp tahini, lemon, garlic and paprika.", "Add oil and water until smooth."], "Guacamole": ["Halve 2 ripe avocados and scoop out.", "Mash with the juice of 1 lime and ½ tsp salt.", "Stir in finely chopped red onion, tomato, chili and cilantro.", "Serve right away, or press plastic wrap onto the surface so it does not brown."], "Pico de gallo": ["Finely chop 4 tomatoes, ½ red onion and 1 chili.", "Mix with the juice of 1 lime, salt and cilantro.", "Rest for 10 min before serving."], "Tzatziki": ["Grate ½ cucumber, salt it and squeeze out the water after 5 min.", "Mix with 3 dl thick yogurt and 1 grated garlic clove.", "Add dill, a little olive oil and salt."], "Loaded nachos": ["Heat the oven to 200°C.", "Spread tortilla chips on a tray and add beans and plenty of grated cheese.", "Bake for 8 min until melted.", "Top with salsa, sour cream, avocado and chili."], "Butter popcorn": ["Heat 2 tbsp oil and 1 dl kernels in a large pot with a lid on medium-high.", "When they start popping, shake the pot now and then.", "When the popping slows to 2–3 seconds between pops, take it off the heat.", "Toss with 2 tbsp melted butter and salt."], "Cinnamon sugar popcorn": ["Pop 1 dl kernels as for butter popcorn.", "Melt 2 tbsp butter and mix with 1 tbsp sugar and 1 tsp cinnamon.", "Toss the popcorn in it right away."], "Parmesan herb popcorn": ["Pop 1 dl kernels.", "Toss with 2 tbsp olive oil, 3 tbsp finely grated parmesan, garlic powder and oregano."], "Crispy roasted chickpeas": ["Heat the oven to 200°C.", "Drain and rinse 1 can chickpeas and dry them very well with a towel.", "Toss with 1 tbsp oil, salt and spices.", "Roast for 25–30 min, shaking once, until crunchy. They crisp more as they cool."], "Spiced nuts": ["Heat the oven to 180°C.", "Toss 3 dl nuts with 1 tbsp oil, 1 tsp paprika, ½ tsp cumin and salt (and 1 tsp honey).", "Roast for 8–10 min until fragrant. Watch closely so they don't burn."], "Honey roasted nuts": ["Heat the oven to 170°C.", "Toss 3 dl nuts with 2 tbsp honey, a pinch of salt and cinnamon.", "Spread on a lined tray and roast for 10–12 min, stirring once.", "Cool on the tray and break apart."], "Garlic bread": ["Heat the oven to 200°C.", "Mix 75 g soft butter with 3 crushed garlic cloves, parsley and salt.", "Cut a baguette into slices without cutting all the way through, and spread butter between them.", "Wrap in foil and bake for 10 min, then open the foil for 3 min to crisp."], "Bruschetta": ["Dice 4 ripe tomatoes and mix with olive oil, salt and basil.", "Toast or grill slices of bread.", "Rub with a cut garlic clove.", "Spoon over the tomatoes just before serving."], "Oven potato wedges": ["Heat the oven to 220°C.", "Cut 1 kg potatoes into wedges (no need to peel).", "Toss with 3 tbsp oil, salt, paprika and garlic powder.", "Spread out on a tray and roast for 30–35 min, turning once."], "Sweet potato fries": ["Heat the oven to 220°C.", "Cut 2 sweet potatoes into thin sticks.", "Toss with 1 tbsp cornstarch, then 2 tbsp oil and salt.", "Spread out with space between them and roast for 25 min, turning once."], "Patatas bravas": ["Roast 800 g potato cubes with oil and salt at 220°C for 35 min.", "Simmer 1 can tomatoes with 1 tsp smoked paprika, garlic and chili for 15 min, then blend.", "Mix mayo with a crushed garlic clove.", "Serve the potatoes with both sauces."], "Onion rings": ["Slice 2 onions into 1 cm rings and separate them.", "Toss in flour, dip in beaten egg, then coat in breadcrumbs with paprika.", "Fry in 2 cm oil at about 175°C for 2 min until golden.", "Drain on paper and salt."], "Mozzarella sticks": ["Cut 250 g firm mozzarella into sticks and freeze for 15 min.", "Coat in flour, egg and breadcrumbs. Dip in egg and breadcrumbs again.", "Freeze for 15 min more.", "Fry in hot oil for 1 min until golden. Serve with tomato sauce."], "Homemade chicken nuggets": ["Cut 2 chicken breasts into pieces and season.", "Coat in flour, beaten egg and breadcrumbs (with paprika).", "Fry in oil for 2–3 min per side, or bake at 220°C for 15 min.", "Serve with ketchup."], "Spicy buffalo wings": ["Heat the oven to 220°C.", "Pat 1 kg wings dry and toss with salt and garlic powder.", "Roast on a rack for 35–40 min until crisp.", "Melt 3 tbsp butter with 3 tbsp sriracha (and 1 tsp honey) and toss the wings in it.", "Serve with sour cream dip."], "BBQ chicken wings": ["Roast 1 kg seasoned wings at 220°C for 30 min.", "Mix 4 tbsp ketchup, 2 tbsp honey, 1 tsp paprika and garlic.", "Toss the wings in the sauce and roast for 10 min more until sticky."], "Deviled eggs": ["Boil 6 eggs for 10 min, cool and peel.", "Halve and scoop out the yolks.", "Mash the yolks with 3 tbsp mayo, 1 tsp mustard and salt.", "Spoon or pipe back in and sprinkle with paprika."], "Sausage rolls": ["Heat the oven to 200°C.", "Cut puff pastry into strips. Squeeze sausage meat out of 400 g sausages and lay it along each strip.", "Roll up, seal with egg and cut into 4 cm pieces.", "Brush with egg and bake for 20 min until puffed and golden."], "Cheese straws": ["Heat the oven to 200°C.", "Sprinkle a sheet of puff pastry with grated cheese and paprika.", "Fold in half, roll lightly and cut into 1 cm strips.", "Twist each strip and bake for 12 min."], "Pigs in blankets": ["Heat the oven to 200°C.", "Cut puff pastry into thin strips.", "Wrap each small sausage and brush with egg.", "Bake for 15–18 min. Serve with mustard."], "Pita chips": ["Heat the oven to 190°C.", "Cut pita into triangles and split them.", "Brush with olive oil and sprinkle with salt (and paprika).", "Bake for 8–10 min until crisp."], "Homemade tortilla chips": ["Heat the oven to 190°C.", "Cut tortillas into 8 triangles.", "Brush with oil and salt.", "Bake for 8–10 min until crisp, turning once."], "Energy balls": ["Mix 2 dl oats, 4 tbsp peanut butter and 2 tbsp honey.", "Stir in chopped chocolate (or raisins).", "Roll into walnut-sized balls (and roll in coconut).", "Chill for 30 min. Keeps for a week in the fridge."], "Oat granola bars": ["Heat the oven to 170°C and line a 20 cm tin.", "Melt 75 g butter, 4 tbsp honey and 2 tbsp brown sugar.", "Stir in 4 dl oats, nuts and raisins or chocolate.", "Press firmly into the tin and bake for 20 min.", "Cool completely before cutting."], "Trail mix": ["Mix equal amounts of nuts and raisins.", "Add chocolate pieces and coconut.", "Store in a jar."], "Apple chips": ["Heat the oven to 100°C.", "Slice 2 apples as thin as you can (no need to core).", "Lay on lined trays and sprinkle with cinnamon.", "Bake for 1.5–2 hours, turning once, until dry. They crisp as they cool."], "Frozen yogurt bark": ["Mix 4 dl thick yogurt with 2 tbsp honey.", "Spread 1 cm thick on a lined tray.", "Scatter berries, nuts or chocolate on top.", "Freeze for 2–3 hours, then break into pieces. Keep frozen."], "Berry smoothie": ["Serves 1. Blend 2 dl frozen berries, 1 banana and 2 dl milk (or yogurt) until smooth.", "Add oats or honey if you like."], "Pita pizzas": ["Heat the oven to 220°C.", "Spread pitas with tomato paste thinned with a little water.", "Add cheese and toppings.", "Bake for 8 min."], "Halloumi fries": ["Cut 250 g halloumi into sticks and toss in flour with paprika.", "Fry in 1 cm oil for 1–2 min per side until golden.", "Serve with sweet chili sauce or yogurt."], "Homemade crackers": ["Heat the oven to 200°C.", "Mix 2.5 dl flour, ½ tsp salt, 3 tbsp oil and 1 dl water into a dough.", "Roll very thin on baking paper and sprinkle with sesame seeds and salt.", "Cut into squares and prick with a fork.", "Bake for 10–12 min until golden."], "Parmesan crisps": ["Heat the oven to 200°C.", "Put tablespoon-sized piles of grated parmesan on a lined tray and flatten slightly.", "Bake for 5–6 min until golden.", "Cool on the tray until crisp."], "Spinach and cream cheese dip": ["Fry 2 garlic cloves in butter, add 200 g spinach and cook until wilted. Squeeze out the water.", "Stir in 200 g cream cheese and parmesan until melted.", "Serve warm with bread or chips."], "French onion dip": ["Cook 2 chopped onions slowly in butter for 20 min until golden.", "Cool.", "Mix with 3 dl sour cream, salt and garlic powder.", "Chill for 1 hour. Serve with chips."], "Queso dip": ["Toss 200 g grated cheese with 1 tsp cornstarch.", "Warm 2 dl milk in a pan.", "Add the cheese a handful at a time on low heat, stirring until smooth.", "Stir in salsa or chopped chili. Serve warm with chips."], "Baba ganoush": ["Heat the oven to 220°C. Prick 2 eggplants and roast for 40 min until collapsed.", "Cool, then scoop out the flesh and drain it.", "Mash with 2 tbsp tahini, juice of 1 lemon, 1 garlic clove and salt.", "Drizzle with olive oil."], "Tuna dip": ["Mix 1 can tuna with 100 g cream cheese and lemon juice until smooth.", "Add red onion and pepper.", "Serve with crackers."], "Smoked salmon roll-ups": ["Spread tortillas with cream cheese.", "Cover with smoked salmon (and dill or lettuce).", "Roll tightly and chill for 30 min.", "Slice into rounds."], "Caprese skewers": ["Thread cherry tomatoes, small mozzarella balls and basil onto sticks.", "Drizzle with balsamic and olive oil and add salt."], "Ham and cheese muffins": ["Makes 12. Heat the oven to 190°C.", "Mix 4 dl flour and 2 tsp baking powder.", "Whisk 2 eggs, 2.5 dl milk and 75 g melted butter, then stir into the flour.", "Fold in 150 g diced ham and 100 g cheese.", "Divide into a muffin tin and bake for 20 min."], "Samosa puffs": ["Boil 2 diced potatoes until soft. Fry with onion, 1 tbsp curry powder and 1 dl peas.", "Cool the filling.", "Cut puff pastry into squares, fill and fold into triangles. Press the edges with a fork.", "Brush with egg or milk and bake at 200°C for 20 min."], "Cheese toastie fingers": ["Butter bread on the outside and fill with cheese (and ham).", "Fry on medium-low until golden on both sides.", "Cut into fingers."], "Cucumber bites with cream cheese": ["Slice a cucumber into thick rounds.", "Pipe or spoon on cream cheese.", "Top with smoked salmon and dill."], "Chocolate sheet cake (langpannekake)": ["Heat the oven to 180°C and line a 30×40 cm tray with baking paper.", "Melt 200 g butter and let it cool a little.", "Whisk 4 eggs and 4 dl sugar for 3–4 min until pale and fluffy.", "Stir in the butter and 2 dl milk. Sift in 5 dl flour, 4 tbsp cocoa, 3 tsp baking powder and 2 tsp vanilla sugar and fold until smooth.", "Spread in the tray and bake for 20–25 min, until a skewer comes out clean.", "Icing: mix 4 dl icing sugar, 2 tbsp cocoa, 50 g melted butter and 3–4 tbsp coffee or water. Spread on the cooled cake and sprinkle with coconut."], "Classic chocolate layer cake": ["Heat the oven to 175°C and grease two 22 cm tins.", "Whisk 4 eggs and 3 dl sugar until fluffy. Stir in 150 g melted butter and 2 dl milk.", "Fold in 4 dl flour, 5 tbsp cocoa and 2 tsp baking powder.", "Divide between the tins and bake for 25–30 min. Cool completely.", "Ganache: heat 2.5 dl cream until steaming, pour over 200 g chopped chocolate, wait 2 min and stir smooth. Cool until spreadable.", "Sandwich the cakes and cover the top and sides with ganache."], "Brownies": ["Heat the oven to 175°C and line a 20×20 cm tin.", "Melt 150 g butter and 150 g dark chocolate together on low heat.", "Whisk in 3 dl sugar, then 3 eggs one at a time (and 1 tsp vanilla).", "Fold in 1.5 dl flour, 2 tbsp cocoa and a pinch of salt (and nuts).", "Bake for 22–25 min. The middle should still be slightly soft, as it firms while cooling.", "Cool completely before cutting into squares."], "Peanut butter brownies": ["Make the brownie batter and spread it in a lined tin.", "Warm 4 tbsp peanut butter until runny and drop spoonfuls on top.", "Swirl with a knife.", "Bake at 175°C for 25 min. Cool before cutting."], "Cream cheese brownies": ["Make the brownie batter and spread three-quarters in a lined tin.", "Beat 200 g cream cheese with 1 dl sugar, 1 egg and vanilla until smooth.", "Spoon over and dot the rest of the brownie batter on top. Swirl with a knife.", "Bake at 175°C for 30 min. Chill before cutting."], "Blondies": ["Heat the oven to 175°C and line a 20×20 cm tin.", "Melt 125 g butter and whisk with 2 dl brown sugar until smooth.", "Whisk in 1 egg and 1 tsp vanilla.", "Fold in 2.5 dl flour and a pinch of salt, then 100 g chopped chocolate or nuts.", "Bake for 22–25 min until golden and just set. Cool and cut."], "Chocolate chip cookies": ["Makes about 16. Beat 125 g soft butter with 1 dl brown sugar and 1 dl white sugar until creamy.", "Beat in 1 egg and 1 tsp vanilla.", "Mix in 3 dl flour, ½ tsp baking soda and ½ tsp salt.", "Fold in 150 g chopped chocolate. Chill the dough for 30 min if you have time.", "Heat the oven to 180°C. Scoop balls onto lined trays with space between them.", "Bake for 10–11 min until golden at the edges but still soft in the middle. Cool on the tray for 5 min."], "Double chocolate cookies": ["Beat 125 g butter with 2 dl sugar, then add 1 egg.", "Mix in 2.5 dl flour, 3 tbsp cocoa and ½ tsp baking soda.", "Fold in 100 g chopped chocolate.", "Bake balls at 180°C for 9–10 min. They will look underdone but firm up as they cool."], "Oatmeal raisin cookies": ["Beat 125 g butter with 1.5 dl brown sugar and 1 egg.", "Mix in 2 dl flour, 3 dl oats, ½ tsp baking soda and 1 tsp cinnamon.", "Fold in 1 dl raisins.", "Bake spoonfuls at 180°C for 11–12 min."], "Peanut butter cookies": ["Mix 2.5 dl peanut butter, 2 dl sugar and 1 egg (and ½ tsp baking soda) until smooth.", "Roll into walnut-sized balls and press with a fork in a criss-cross.", "Bake at 180°C for 9–10 min. Cool on the tray, as they are soft while warm."], "Shortbread": ["Heat the oven to 160°C.", "Rub 200 g soft butter, 1 dl sugar and 5 dl flour (and 2 tbsp cornstarch) into a dough.", "Press into a 20×20 cm tin, prick all over with a fork and chill for 15 min.", "Bake for 30–35 min until pale golden.", "Cut into fingers while warm and sprinkle with sugar. Cool in the tin."], "Sugar cookies": ["Beat 150 g butter and 1.5 dl sugar, then add 1 egg and 1 tsp vanilla.", "Mix in 5 dl flour and 1 tsp baking powder. Chill for 30 min.", "Roll out to 4 mm on a floured surface and cut shapes.", "Bake at 180°C for 8–10 min until barely golden.", "Decorate with icing (icing sugar and a few drops of water)."], "Banana bread": ["Heat the oven to 175°C and grease a 1.5 litre loaf tin.", "Mash 3 very ripe bananas.", "Mix in 100 g melted butter, 1.5 dl sugar and 2 eggs.", "Fold in 4 dl flour, 1 tsp baking soda, a pinch of salt and cinnamon (and nuts or chocolate).", "Bake for 55–60 min until a skewer comes out clean. Cover with foil if it browns too fast.", "Cool for 15 min in the tin before turning out."], "Chocolate banana bread": ["Make the banana bread batter, swapping 3 tbsp flour for 3 tbsp cocoa.", "Fold in 100 g chopped chocolate.", "Bake at 175°C for 60 min."], "Carrot cake (gulrotkake)": ["Heat the oven to 175°C and line a 24×30 cm tin.", "Whisk 3 eggs and 3 dl sugar until fluffy, then add 2 dl oil.", "Stir in 4 dl finely grated carrots.", "Fold in 3.5 dl flour, 2 tsp baking powder, 2 tsp cinnamon (and nuts and raisins).", "Bake for 35–40 min. Cool completely.", "Frosting: beat 200 g cream cheese, 50 g soft butter, 3 dl icing sugar and vanilla until smooth. Spread on top."], "Norwegian apple cake (eplekake)": ["Heat the oven to 180°C and grease a 24 cm tin.", "Beat 150 g soft butter and 1.5 dl sugar until pale, then add 2 eggs one at a time.", "Fold in 2 dl flour and 1 tsp baking powder.", "Spread in the tin. Press 2–3 apples, in thin wedges, into the top.", "Sprinkle with 2 tbsp sugar mixed with 1 tsp cinnamon (and nuts).", "Bake for 35–40 min until golden. Serve warm with cream or vanilla sauce."], "Lemon drizzle cake": ["Heat the oven to 175°C and line a loaf tin.", "Beat 150 g butter and 2 dl sugar, add 3 eggs, then the zest of 1 lemon.", "Fold in 3 dl flour, 1.5 tsp baking powder and 1 dl milk.", "Bake for 40–45 min.", "Mix the juice of 1 lemon with 1 dl icing sugar. Prick the warm cake all over and pour over the drizzle."], "Lemon bars": ["Heat the oven to 175°C and line a 20×20 cm tin.", "Base: rub 2.5 dl flour, 100 g butter and 3 tbsp sugar together, press into the tin and bake for 15 min.", "Whisk 3 eggs, 2.5 dl sugar, the juice and zest of 2 lemons and 3 tbsp flour.", "Pour over the hot base and bake for 20 min until set.", "Cool, chill and dust with icing sugar."], "Yogurt cake": ["Heat the oven to 175°C and grease a 22 cm tin.", "Whisk 2 dl yogurt, 2 dl sugar, 3 eggs, 1 dl oil and lemon zest or vanilla.", "Fold in 3 dl flour and 2 tsp baking powder (and berries).", "Bake for 35–40 min."], "Pound cake": ["Heat the oven to 165°C and grease a loaf tin.", "Beat 200 g soft butter and 2 dl sugar for 5 min until very fluffy.", "Add 4 eggs one at a time, beating well after each.", "Fold in 3 dl flour (with 1 tsp baking powder) and vanilla or lemon zest.", "Bake for 55–60 min until a skewer comes out clean."], "Sponge cake (sukkerbrød)": ["Heat the oven to 175°C. Grease and flour a 24 cm tin.", "Whisk 4 eggs and 2 dl sugar with an electric whisk for 8 min until thick and white.", "Sift in 2 dl flour mixed with 1 tsp baking powder (and 1 tsp vanilla sugar).", "Fold gently with a spatula so you keep the air in.", "Bake on a low rack for 30–35 min. Do not open the oven for the first 20 min.", "Cool completely before slicing."], "Cream cake with berries (bløtkake)": ["Bake a sponge cake the day before or in the morning, and cool completely.", "Slice it horizontally into 3 layers.", "Whip 5 dl cream with 1 tbsp sugar and vanilla.", "Moisten each layer with a few spoons of milk. Spread with jam, cream and berries.", "Stack, cover the top and sides with cream and decorate with berries.", "Chill for at least 2 hours."], "Baked cheesecake": ["Crush 200 g biscuits, mix with 75 g melted butter and press into a 22 cm springform tin. Chill.", "Heat the oven to 160°C.", "Beat 600 g cream cheese with 1.5 dl sugar until smooth. Add 3 eggs one at a time, then vanilla, lemon zest and 2 dl sour cream.", "Pour over the base and bake for 45–50 min until set at the edges with a slight wobble in the middle.", "Turn off the oven and let it cool inside with the door ajar for 1 hour.", "Chill overnight. Top with berries."], "No-bake cheesecake": ["Crush 200 g biscuits, mix with 75 g melted butter and press into a 22 cm tin.", "Beat 400 g cream cheese with 1.5 dl icing sugar, vanilla and lemon zest.", "Whip 3 dl cream to soft peaks and fold in.", "Spread over the base and chill for at least 4 hours.", "Top with berries."], "Blueberry muffins": ["Makes 12. Heat the oven to 200°C and line a muffin tin.", "Mix 4 dl flour, 1.5 dl sugar, 2 tsp baking powder and a pinch of salt.", "Whisk 2 eggs, 1.5 dl milk and 100 g melted butter (and vanilla).", "Stir into the dry until just combined, then fold in 2 dl berries.", "Fill the cases and bake for 18–20 min until golden."], "Chocolate muffins": ["Makes 12. Heat the oven to 200°C.", "Mix 3.5 dl flour, 1.5 dl sugar, 4 tbsp cocoa and 2 tsp baking powder.", "Whisk 2 eggs, 2 dl milk and 100 g melted butter and stir in.", "Fold in 100 g chopped chocolate.", "Bake for 18 min."], "Banana muffins": ["Makes 12. Heat the oven to 190°C.", "Mash 3 bananas and mix with 2 eggs, 1 dl sugar and 75 g melted butter.", "Fold in 3.5 dl flour, 2 tsp baking powder and cinnamon.", "Bake for 20 min."], "Vanilla cupcakes": ["Makes 12. Heat the oven to 180°C.", "Beat 125 g butter and 1.5 dl sugar, add 2 eggs and vanilla.", "Fold in 3 dl flour, 1.5 tsp baking powder and 1 dl milk.", "Fill cases two-thirds and bake for 18 min. Cool completely.", "Frosting: beat 100 g butter with 3 dl icing sugar and a splash of milk until fluffy. Pipe on top."], "Red velvet cupcakes": ["Makes 12. Heat the oven to 175°C.", "Whisk 1.5 dl oil, 2 dl sugar, 1 egg, 1.5 dl yogurt, 1 tbsp vinegar and red colouring if you have it.", "Fold in 3 dl flour, 2 tbsp cocoa and 1 tsp baking soda.", "Bake for 20 min and cool.", "Top with cream cheese frosting (200 g cream cheese, 50 g butter, 3 dl icing sugar)."], "Marble cake": ["Heat the oven to 170°C and grease a 1.5 litre tin.", "Make a pound cake batter: 200 g butter, 2 dl sugar, 4 eggs, 3 dl flour, 1 tsp baking powder and ½ dl milk.", "Stir 2 tbsp cocoa into a third of the batter.", "Layer the light and dark batter in the tin and swirl with a knife.", "Bake for 50–55 min."], "Cinnamon buns (kanelboller)": ["Warm 5 dl milk with 150 g butter until just lukewarm. Stir in 50 g fresh yeast or 1 pack dry yeast.", "Add 1.5 dl sugar, 2 tsp cardamom, a pinch of salt and about 1 kg flour. Knead for 10 min until smooth and slightly sticky.", "Cover and rise for 45–60 min until doubled.", "Roll out to a 40×60 cm rectangle. Spread with 100 g soft butter, 1 dl sugar and 2 tbsp cinnamon.", "Roll up tightly and slice into 3 cm pieces. Place on lined trays and rise for 30 min.", "Brush with egg and bake at 220°C for 10–12 min until golden."], "Skillingsboller": ["Make the cinnamon bun dough and let it rise until doubled.", "Roll out, spread with butter and cinnamon sugar, and roll up.", "Cut into thick 4 cm slices and place on trays, cut-side up. Rise for 30 min.", "Bake at 220°C for 10–12 min.", "Brush right away with syrup (equal parts sugar and water, boiled) and dip in sugar."], "Cardamom buns (hveteboller)": ["Make the bun dough with 2 tsp cardamom (and a handful of raisins) and let it rise.", "Divide into 24 pieces and roll into round buns.", "Place on trays and rise for 30 min.", "Brush with beaten egg and bake at 220°C for 8–10 min."], "School buns (skolebrød)": ["Custard: heat 3 dl milk. Whisk 2 egg yolks, 3 tbsp sugar, 2 tbsp cornstarch and vanilla, pour the milk on, then return to the pan and stir until thick. Cool.", "Make the bun dough with cardamom and let it rise. Shape 20 round buns and rise for 30 min.", "Press a deep dent in each bun and fill with a spoonful of custard.", "Bake at 220°C for 10 min and cool.", "Brush the edges with icing (icing sugar and water) and dip in coconut."], "American cinnamon rolls": ["Make an enriched dough: 2.5 dl warm milk, 1 pack yeast, 75 g butter, 1 egg, 1 dl sugar and 7 dl flour. Rise for 1 hour.", "Roll out, spread with 75 g soft butter, 1.5 dl brown sugar and 2 tbsp cinnamon.", "Roll up, cut 12 thick rolls and place in a greased dish. Rise for 30 min.", "Bake at 190°C for 22–25 min.", "Frost warm with 100 g cream cheese, 2 dl icing sugar and vanilla."], "Focaccia": ["Mix 500 g flour, 1 tsp dry yeast, 2 tsp salt and 4 dl lukewarm water into a wet, sticky dough. No kneading needed.", "Cover and rise for 2 hours (or overnight in the fridge).", "Pour 4 tbsp olive oil into a 25×35 cm tin and tip the dough in. Stretch it to the corners and rise for 30 min.", "Dimple all over with oiled fingers. Drizzle with oil and add flaky salt, rosemary, tomatoes or olives.", "Bake at 230°C for 20–25 min until deep golden."], "Simple white bread": ["Mix 600 g flour, 1 tsp dry yeast, 2 tsp salt and 4 dl lukewarm water.", "Knead for 10 min until smooth and stretchy.", "Cover and rise for 1.5 hours until doubled.", "Shape into a loaf, put in a greased tin and rise for 45 min.", "Bake at 220°C for 35 min. It's done when it sounds hollow when you tap the bottom. Cool on a rack."], "Naan": ["Mix 5 dl flour, 1 tsp dry yeast, 1 tsp sugar, 1 tsp salt, 1.5 dl yogurt and 1 dl warm water. Knead for 5 min.", "Rise for 1 hour.", "Divide into 6 and roll into ovals about 5 mm thick.", "Cook in a very hot dry pan for 1–2 min per side until bubbled and charred in spots.", "Brush with butter mixed with crushed garlic."], "Pita bread": ["Mix 5 dl flour, 1 tsp yeast, 1 tsp salt, 1 tbsp oil and 2.5 dl warm water. Knead for 8 min.", "Rise for 1 hour.", "Heat the oven to 250°C with a tray inside.", "Divide into 8 and roll into thin rounds.", "Bake on the hot tray for 4–5 min until puffed. Wrap in a towel to keep soft."], "Bread rolls (rundstykker)": ["Warm 5 dl milk until lukewarm and add 1 pack yeast and 50 g melted butter.", "Add 1 tsp salt and about 13 dl flour (with some oats) and knead for 10 min.", "Rise for 1 hour.", "Shape 16 rolls, brush with egg and add sesame seeds. Rise for 30 min.", "Bake at 220°C for 12–15 min."], "Scones": ["Heat the oven to 220°C.", "Rub 75 g cold butter into 5 dl flour, 3 tsp baking powder, 1 tbsp sugar and a pinch of salt until crumbly.", "Add 2 dl milk (and raisins) and mix briefly into a soft dough. Do not overwork it.", "Pat out 2.5 cm thick and cut into rounds or wedges.", "Brush with milk and bake for 12–14 min. Serve with jam and cream."], "Cheese scones": ["Heat the oven to 220°C.", "Rub 75 g butter into 5 dl flour and 3 tsp baking powder.", "Add 150 g grated cheese, 2 dl milk (and 1 tsp mustard).", "Pat out, cut and top with more cheese.", "Bake for 12–14 min."], "Quick soda bread": ["Heat the oven to 200°C.", "Mix 5 dl flour (and 1 dl oats), 1 tsp baking soda and 1 tsp salt.", "Stir in 4 dl yogurt thinned with a little milk into a soft dough.", "Shape a round on a tray and cut a deep cross on top.", "Bake for 35–40 min until it sounds hollow when tapped."], "Tosca cake": ["Heat the oven to 175°C and grease a 24 cm tin.", "Whisk 2 egg /* ---------- state + persistence ---------- */
const LKEY="kitchen-stock-v1";
let state={items:[]};
try{const s=JSON.parse(localStorage.getItem(LKEY)); if(s&&Array.isArray(s.items)) state=s;}catch(e){}
function persist(){ try{localStorage.setItem(LKEY,JSON.stringify(state))}catch(e){} }
if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

/* ---------- helpers ---------- */
const slug=s=>s.toLowerCase().trim().replace(/[^a-z0-9æøå]+/g,"-").replace(/^-|-$/g,"");
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LOC_LABEL={pantry:"Pantry",fridge:"Fridge",freezer:"Freezer"};
const STATUS_LABEL={have:"Have",low:"Low",out:"Out",none:"Not kept"};
const NEXT={none:"have",have:"low",low:"out",out:"none"};
const inStock=i=>i.status==="have"||i.status==="low";
const needBuy=i=>i.status==="low"||i.status==="out";
function toast(msg){const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("show"),1800);}
function haveKeys(){
  const s=new Set(["salt","pepper","oil"]);
  state.items.forEach(i=>{ if(inStock(i)){ s.add(i.key); s.add(slug(i.name)); } });
  return s;
}
function nameOf(k){ const it=state.items.find(i=>i.key===k); return it?it.name:(BY_KEY[k]?BY_KEY[k].name:k); }
function addItem(name,loc,status){
  name=name.trim(); if(!name) return null;
  const ck=BY_NAME[name.toLowerCase()];
  const key=ck||slug(name);
  const existing=state.items.find(i=>i.key===key);
  if(existing){ existing.status=status; return existing; }
  const base=ck?BY_KEY[ck]:null;
  const it={id:uid(),key,name:base?base.name:name,cat:base?base.cat:"Other",loc:loc||(base?base.loc:"pantry"),status};
  state.items.push(it); return it;
}
